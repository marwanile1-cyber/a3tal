name: Publish illustrated DTC39 P0301 cylinder 1 guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dtc39-p0301.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3TAL_BATCH39_RELEASE: '1'
      A3TAL_DTC39_CODE: P0301
    steps:
      - uses: actions/checkout@v4
      - name: Install font and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install -q Pillow
      - name: Validate original article and cylinder misfire illustration
        run: |
          python3 -m py_compile scripts/release-dtc-batch39-component.py scripts/render-dtc-batch39-component-images.py
          python3 - <<'PY'
          import json,re
          d=json.load(open('data/dtc-batch39-p0301-20261031.json',encoding='utf8'))
          assert d['batch']==39 and len(d['items'])==1
          x=d['items'][0];wc=len(re.sub(r'<[^>]+>',' ',x['content']).split())
          assert x['code']=='P0301' and wc>=1500 and x['word_count']==wc and x['qa']['ready_for_publication']
          assert 'N5020401U000XD00USA' in x['source']
          print('DTC39_P0301_EDITORIAL_PASS',wc)
          PY
          python3 scripts/render-dtc-batch39-component-images.py P0301
      - name: Publish original P0301 and verify featured/OG
        run: python3 -u scripts/release-dtc-batch39-component.py
