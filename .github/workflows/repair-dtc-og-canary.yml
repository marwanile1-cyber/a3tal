name: Repair OG images for original DTC batches 07 and 08
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-dtc-og-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Repair the nine remaining confirmed WebP OG images and verify each via REST
        run: python3 -u scripts/repair-dtc-og-canary.py
