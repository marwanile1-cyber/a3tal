name: A3tal Bridge Task

on:
  push:
    paths:
      - 'task.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secret
        shell: bash
        env:
          A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
        run: |
          if [ -z "$A3TAL_API_KEY" ]; then
            echo "Missing repository secret A3TAL_API_KEY"
            exit 1
          fi

      - name: Execute requests
        shell: bash
        env:
          A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
        run: |
          set -euo pipefail
          # Reject syntax errors before any live write.
          php -l theme-source/a3tal-global/functions.php
          php -l theme-source/a3tal-global/front-page.php
          node --check theme-source/a3tal-global/assets/js/theme.js
          TASK_FILE="task.json"
          BASE="https://a3tal.com/wp-json/a3tal-direct/v1"

          if [ ! -f "$TASK_FILE" ]; then
            echo "task.json not found"
            exit 1
          fi

          COUNT="$(jq '.requests | length' "$TASK_FILE")"
          for ((i=0; i<COUNT; i++)); do
            METHOD="$(jq -r ".requests[$i].method // \"POST\"" "$TASK_FILE")"
            PATH_PART="$(jq -r ".requests[$i].path" "$TASK_FILE")"
            BODY_FILE="/tmp/a3tal-body-$i.json"
            jq -c ".requests[$i].body // {}" "$TASK_FILE" > "$BODY_FILE"
            # Controlled source-file deployment: take file bytes from this repository, not from secrets or inline JSON.
            if jq -e '.content_file and (.content_file | type == "string") and (.content_file | length > 0)' "$BODY_FILE" >/dev/null; then
              CONTENT_FILE="$(jq -r '.content_file' "$BODY_FILE")"
              case "$CONTENT_FILE" in
                theme-source/a3tal-global/*) ;;
                *) echo "Disallowed repository content_file"; exit 1 ;;
              esac
              if [ ! -f "$CONTENT_FILE" ]; then echo "Missing content file: $CONTENT_FILE"; exit 1; fi
              jq --rawfile content "$CONTENT_FILE" 'del(.content_file) | .content = $content' "$BODY_FILE" > "$BODY_FILE.tmp"
              mv "$BODY_FILE.tmp" "$BODY_FILE"
            fi
            # For active themes, patch live code in place and verify the old SHA before writing.
            if jq -e '.patches and (.patches | type == "array") and (.patches | length > 0)' "$BODY_FILE" >/dev/null; then
              LIVE_PATH="$(jq -r '.path' "$BODY_FILE")"
              case "$LIVE_PATH" in
                themes/a3tal-global/functions.php|themes/a3tal-global/front-page.php|themes/a3tal-global/assets/js/theme.js|themes/a3tal-global/style.css) ;;
                *) echo "Disallowed live patch path"; exit 1 ;;
              esac
              LIVE_RESPONSE="/tmp/a3tal-live-$i.json"
              STATUS="$(curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 100 --silent --show-error -o "$LIVE_RESPONSE" -w "%{http_code}" -G -H "X-A3tal-Key: $A3TAL_API_KEY" -H "Authorization: Bearer $A3TAL_API_KEY" --data-urlencode "op=file_read" --data-urlencode "path=$LIVE_PATH" "$BASE/admin")"
              if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then echo "Could not read live theme file (HTTP $STATUS)"; exit 1; fi
              python3 - "$BODY_FILE" "$LIVE_RESPONSE" <<'PY'
            import json,sys
            body_path,live_path=sys.argv[1:]
            with open(body_path,encoding='utf-8') as file: body=json.load(file)
            with open(live_path,encoding='utf-8') as file: response=json.load(file)
            if not response.get('ok') or not response.get('result',{}).get('sha256'):
                raise SystemExit('Missing validated live file response')
            content=response['result']['content']
            for index,patch in enumerate(body['patches'],1):
                if 'append' in patch:
                    addition=patch['append']
                    if not addition or addition in content: raise SystemExit(f'Patch {index}: empty or duplicate append')
                    content+=addition
                else:
                    old,new=patch['from'],patch['to']
                    count=content.count(old)
                    if count!=1: raise SystemExit(f'Patch {index}: expected one match, got {count}')
                    content=content.replace(old,new,1)
            body['content']=content
            body['expected_sha256']=response['result']['sha256']
            del body['patches']
            with open(body_path,'w',encoding='utf-8') as file: json.dump(body,file,ensure_ascii=False)
            print(f"Validated {len(content)} output characters and a conflict-checked live SHA")
            PY
            fi
                        if jq -e '.image_svg_file and (.image_svg_file | type == "string") and (.image_svg_file | length > 0)' "$BODY_FILE" >/dev/null; then
              SVG_FILE="$(jq -r '.image_svg_file' "$BODY_FILE")"
              if [ ! -f "$SVG_FILE" ]; then
                echo "Missing SVG source: $SVG_FILE"
                exit 1
              fi
              if ! command -v convert >/dev/null 2>&1; then
                sudo apt-get update -qq
                sudo apt-get install -y imagemagick
              fi
              IMAGE_WEBP="/tmp/a3tal-svg-$i.webp"
              WIDTH="$(jq -r '.render_width // 3840' "$BODY_FILE")"
              HEIGHT="$(jq -r '.render_height // 2160' "$BODY_FILE")"
              QUALITY="$(jq -r '.render_quality // 86' "$BODY_FILE")"
              convert -background none "$SVG_FILE" -resize "${WIDTH}x${HEIGHT}!" -quality "$QUALITY" "$IMAGE_WEBP"
              IMAGE_B64="/tmp/a3tal-svg-$i.b64"
              base64 -w 0 "$IMAGE_WEBP" > "$IMAGE_B64"
              jq --rawfile b64 "$IMAGE_B64" 'del(.image_svg_file,.render_width,.render_height,.render_quality) | .image_base64 = $b64' "$BODY_FILE" > "$BODY_FILE.tmp"
              mv "$BODY_FILE.tmp" "$BODY_FILE"
            fi
            # Produce a distinct editorial automotive image from verified car-maker media.
            # No text overlays; each file gets unique crop and balanced exposure.
            if jq -e '.image_source_urls and (.image_source_urls | type == "array") and (.image_source_urls | length > 0)' "$BODY_FILE" >/dev/null; then
              if ! command -v convert >/dev/null 2>&1; then
                sudo apt-get update -qq
                sudo apt-get install -y imagemagick
              fi
              IMAGE_WEBP="/tmp/a3tal-editorial-$i.webp"
              WIDTH="$(jq -r '.render_width // 3840' "$BODY_FILE")"
              HEIGHT="$(jq -r '.render_height // 2160' "$BODY_FILE")"
              QUALITY="$(jq -r '.render_quality // 84' "$BODY_FILE")"
              SOURCES="$(jq -r '.image_source_urls | length' "$BODY_FILE")"
              for ((j=0;j<SOURCES;j++)); do
                SOURCE_URL="$(jq -r ".image_source_urls[$j]" "$BODY_FILE")"
                INPUT="/tmp/a3tal-photo-$i-$j"
                curl --fail --location --retry 3 --connect-timeout 30 --max-time 160 --silent --show-error "$SOURCE_URL" -o "$INPUT"
                if ! identify "$INPUT" >/dev/null 2>&1; then
                  echo "Invalid input photo for image source $j"; exit 1
                fi
              done
              if [ "$SOURCES" -eq 1 ]; then
                convert "/tmp/a3tal-photo-$i-0" -auto-orient -resize "${WIDTH}x${HEIGHT}^" -gravity center -extent "${WIDTH}x${HEIGHT}" -colorspace sRGB -modulate 102,101,100 -quality "$QUALITY" "$IMAGE_WEBP"
              elif [ "$SOURCES" -eq 2 ]; then
                HALF=$((WIDTH / 2))
                convert "/tmp/a3tal-photo-$i-0" -auto-orient -resize "${HALF}x${HEIGHT}^" -gravity center -extent "${HALF}x${HEIGHT}" -modulate 101,105,100 "/tmp/a3tal-half-$i-0.png"
                convert "/tmp/a3tal-photo-$i-1" -auto-orient -resize "${HALF}x${HEIGHT}^" -gravity center -extent "${HALF}x${HEIGHT}" -modulate 101,105,100 "/tmp/a3tal-half-$i-1.png"
                convert "/tmp/a3tal-half-$i-0.png" "/tmp/a3tal-half-$i-1.png" +append -quality "$QUALITY" "$IMAGE_WEBP"
              else
                echo "Only one or two source photographs are supported"; exit 1
              fi
              IMAGE_B64="/tmp/a3tal-editorial-$i.b64"
              base64 -w 0 "$IMAGE_WEBP" > "$IMAGE_B64"
              jq --rawfile b64 "$IMAGE_B64" 'del(.image_source_urls,.render_width,.render_height,.render_quality) | .image_base64 = $b64' "$BODY_FILE" > "$BODY_FILE.tmp"
              mv "$BODY_FILE.tmp" "$BODY_FILE"
            fi
            if jq -e '.image_base64_parts and (.image_base64_parts | type == "array") and (.image_base64_parts | length > 0)' "$BODY_FILE" >/dev/null; then
              IMAGE_B64="/tmp/a3tal-image-$i.b64"
              : > "$IMAGE_B64"
              while IFS= read -r PART_FILE; do
                if [ ! -f "$PART_FILE" ]; then
                  echo "Missing image base64 part: $PART_FILE"
                  exit 1
                fi
                cat "$PART_FILE" >> "$IMAGE_B64"
              done < <(jq -r '.image_base64_parts[]' "$BODY_FILE")
              jq --rawfile b64 "$IMAGE_B64" 'del(.image_base64_parts) | .image_base64 = $b64' "$BODY_FILE" > "$BODY_FILE.tmp"
              mv "$BODY_FILE.tmp" "$BODY_FILE"
            fi
            LOG_RESPONSE="$(jq -r ".requests[$i].log_response // false" "$TASK_FILE")"
            RESPONSE="/tmp/a3tal-response-$i.json"

            echo "::group::Request $((i+1)) $METHOD $PATH_PART"
            if [ "$METHOD" = "GET" ]; then
              STATUS="$(curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 --silent --show-error                 -o "$RESPONSE" -w "%{http_code}"                 -H "X-A3tal-Key: $A3TAL_API_KEY"                 -H "Authorization: Bearer $A3TAL_API_KEY"                 "$BASE$PATH_PART")"
            else
              STATUS="$(curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 --silent --show-error                 -o "$RESPONSE" -w "%{http_code}"                 -X "$METHOD"                 -H "X-A3tal-Key: $A3TAL_API_KEY"                 -H "Authorization: Bearer $A3TAL_API_KEY"                 -H "Content-Type: application/json"                 --data-binary @"$BODY_FILE"                 "$BASE$PATH_PART")"
            fi

            echo "HTTP $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              jq '{code,message,data}' "$RESPONSE" 2>/dev/null || echo "Request failed with a non-JSON response."
              exit 1
            fi

            if [[ "$PATH_PART" == /admin* ]] && [ "$LOG_RESPONSE" = "sha_only" ]; then
              jq '{ok,op,result:{path:.result.path,sha256:.result.sha256,size:.result.size}}' "$RESPONSE"
            elif [[ "$PATH_PART" == /admin* ]] && [ "$LOG_RESPONSE" != "true" ]; then
              jq '{ok,op}' "$RESPONSE" 2>/dev/null || echo "Admin request completed."
            else
              jq . "$RESPONSE" 2>/dev/null || cat "$RESPONSE"
            fi
            echo "::endgroup::"
          done

      - name: Verify requests
        if: always()
        shell: bash
        env:
          A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
        run: |
          set -euo pipefail
          TASK_FILE="task.json"
          BASE="https://a3tal.com/wp-json/a3tal-direct/v1"

          if ! jq -e '.verify and (.verify | length > 0)' "$TASK_FILE" >/dev/null; then
            echo "No verification requests."
            exit 0
          fi

          COUNT="$(jq '.verify | length' "$TASK_FILE")"
          for ((i=0; i<COUNT; i++)); do
            PATH_PART="$(jq -r ".verify[$i].path" "$TASK_FILE")"
            LOG_RESPONSE="$(jq -r ".verify[$i].log_response // false" "$TASK_FILE")"
            RESPONSE="/tmp/a3tal-verify-$i.json"

            echo "::group::Verify $((i+1)) GET $PATH_PART"
            STATUS="$(curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 --silent --show-error               -o "$RESPONSE" -w "%{http_code}"               -H "X-A3tal-Key: $A3TAL_API_KEY"               -H "Authorization: Bearer $A3TAL_API_KEY"               "$BASE$PATH_PART")"

            echo "HTTP $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              jq '{code,message,data}' "$RESPONSE" 2>/dev/null || echo "Verification failed with a non-JSON response."
              exit 1
            fi

            if [[ "$PATH_PART" == /admin* ]] && [ "$LOG_RESPONSE" != "true" ]; then
              jq '{ok,op}' "$RESPONSE" 2>/dev/null || echo "Admin verification completed."
            else
              jq . "$RESPONSE" 2>/dev/null || cat "$RESPONSE"
            fi
            echo "::endgroup::"
          done
