name: A3tal Bridge Task

on:
  push:
    paths:
      - 'task.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secret
        shell: bash
        env:
          A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
        run: |
          if [ -z "$A3TAL_API_KEY" ]; then
            echo "Missing repository secret A3TAL_API_KEY"
            exit 1
          fi

      - name: Execute requests
        shell: bash
        env:
          A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
        run: |
          set -euo pipefail
          TASK_FILE="task.json"
          BASE="https://a3tal.com/wp-json/a3tal-direct/v1"

          if [ ! -f "$TASK_FILE" ]; then
            echo "task.json not found"
            exit 1
          fi

          COUNT="$(jq '.requests | length' "$TASK_FILE")"
          for ((i=0; i<COUNT; i++)); do
            METHOD="$(jq -r ".requests[$i].method // \"POST\"" "$TASK_FILE")"
            PATH_PART="$(jq -r ".requests[$i].path" "$TASK_FILE")"
            BODY="$(jq -c ".requests[$i].body // {}" "$TASK_FILE")"

            echo "::group::Request $((i+1)) $METHOD $PATH_PART"
            if [[ "$PATH_PART" == *"?"* ]]; then
              SEP="&"
            else
              SEP="?"
            fi
            REQUEST_URL="$BASE$PATH_PART${SEP}api_key=$A3TAL_API_KEY&key=$A3TAL_API_KEY&token=$A3TAL_API_KEY"

            if [ "$METHOD" = "GET" ]; then
              curl --fail-with-body --silent --show-error \
                -H "X-A3tal-Key: $A3TAL_API_KEY" \
                -H "X-A3tal-API-Key: $A3TAL_API_KEY" \
                -H "X-API-Key: $A3TAL_API_KEY" \
                -H "X-A3tal-Token: $A3TAL_API_KEY" \
                -H "X-Auth-Token: $A3TAL_API_KEY" \
                -H "Authorization: Bearer $A3TAL_API_KEY" \
                "$REQUEST_URL" | tee "/tmp/a3tal-response-$i.json"
            else
              curl --fail-with-body --silent --show-error \
                -X "$METHOD" \
                -H "X-A3tal-Key: $A3TAL_API_KEY" \
                -H "X-A3tal-API-Key: $A3TAL_API_KEY" \
                -H "X-API-Key: $A3TAL_API_KEY" \
                -H "X-A3tal-Token: $A3TAL_API_KEY" \
                -H "X-Auth-Token: $A3TAL_API_KEY" \
                -H "Authorization: Bearer $A3TAL_API_KEY" \
                -H "Content-Type: application/json" \
                --data "$BODY" \
                "$REQUEST_URL" | tee "/tmp/a3tal-response-$i.json"
            fi
            echo
            jq . "/tmp/a3tal-response-$i.json" || true
            echo "::endgroup::"
          done

      - name: Verify requests
        if: always()
        shell: bash
        env:
          A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
        run: |
          set -euo pipefail
          TASK_FILE="task.json"
          BASE="https://a3tal.com/wp-json/a3tal-direct/v1"

          if ! jq -e '.verify and (.verify | length > 0)' "$TASK_FILE" >/dev/null; then
            echo "No verification requests."
            exit 0
          fi

          COUNT="$(jq '.verify | length' "$TASK_FILE")"
          for ((i=0; i<COUNT; i++)); do
            PATH_PART="$(jq -r ".verify[$i].path" "$TASK_FILE")"
            echo "::group::Verify $((i+1)) GET $PATH_PART"
            curl --fail-with-body --silent --show-error \
              -H "X-A3tal-Key: $A3TAL_API_KEY" \
              -H "X-A3tal-API-Key: $A3TAL_API_KEY" \
              -H "X-API-Key: $A3TAL_API_KEY" \
              -H "Authorization: Bearer $A3TAL_API_KEY" \
              "$BASE$PATH_PART" | jq .
            echo "::endgroup::"
          done
