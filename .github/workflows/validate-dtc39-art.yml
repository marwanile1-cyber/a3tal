name: Verify nine original Arabic DTC39 illustrations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-dtc39-art.yml']
permissions: {contents: read}
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install -q Pillow
      - name: Validate distinct original 1600x900 covers
        run: |
          python3 -m py_compile scripts/render-dtc-batch39-component-images.py
          for code in P0171 P0301 P0442 P0128 P0455 P0400 P0136 P0101 P0016; do
            python3 scripts/render-dtc-batch39-component-images.py "$code" || exit 1
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from PIL import Image
          files=sorted(Path('assets/dtc-batch39').glob('*exclusive-ar.webp'))
          assert len(files)==9,files
          hashes=[]
          for p in files:
            raw=p.read_bytes()
            assert 25000<len(raw)<1000000,(p,len(raw))
            with Image.open(p) as im:assert im.format=='WEBP' and im.size==(1600,900)
            hashes.append(hashlib.sha256(raw).hexdigest())
          assert len(set(hashes))==len(hashes)
          print('DTC39_NINE_UNIQUE_COMPONENT_COVERS_OK',flush=True)
          PY
