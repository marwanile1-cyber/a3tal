name: Restore Matrix AC and Tucson steering to 1500 words
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backfill-egypt-1500-batch12.yml','scripts/backfill-egypt-1500-batch12.py','data/expansions/egypt-1500-rebuild-batch12-20261020.json']
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/backfill-egypt-1500-batch12.py scripts/editorial_minimum_words.py
      - run: python3 -u scripts/backfill-egypt-1500-batch12.py
