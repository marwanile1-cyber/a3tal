name: Publish Skoda Octavia 2027 Egypt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-skoda-octavia-2027.yml'
      - 'scripts/publish-skoda-octavia-2027.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3tal-skoda-octavia-2027-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate script and secret
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish-skoda-octavia-2027.py
          test -n "$A3TAL_API_KEY"
      - name: Publish verified Octavia 2027 article and original editorial crops
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 -u scripts/publish-skoda-octavia-2027.py
