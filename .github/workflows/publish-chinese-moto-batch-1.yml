      - name: Cannibalization guard and category
        shell: bash
        run: |
          set -euo pipefail

          search_term() {
            local term="$1"
            local out="/tmp/search-$(echo "$term" | sha1sum | cut -c1-8).json"
            local status
            status=$(curl --silent --show-error --retry 4 --retry-delay 3 --get \
              -o "$out" -w "%{http_code}" \
              -H "X-A3tal-Key: $A3TAL_API_KEY" \
              --data-urlencode "search=$term" \
              --data-urlencode "limit=30" \
              "$BASE/search-posts")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              cat "$out"; exit 11
            fi
            local count
            count=$(jq -r '.count // 0' "$out")
            if [ "$count" -gt 0 ]; then
              echo "Cannibalization guard blocked term: $term"
              jq '.items' "$out"
              exit 12
            fi
          }

          for term in "دايون 4A" "Dayun 4A" "هوجن 3" "Haojiang 3" "حلاوة إكسبريس 150" "Halawa Express 150" "هاوجي KA 150" "Haojue KA150"; do
            search_term "$term"
          done

          CAT_ID=$(curl -fsSL "$SITE/wp-json/wp/v2/categories?slug=motorcycle-guide&per_page=5" | jq -r '.[0].id // empty')
          if [ -z "$CAT_ID" ]; then
            echo "motorcycle-guide category not found"; exit 13
          fi
          echo "$CAT_ID" > /tmp/cat_id
          echo "Category ID: $CAT_ID"

      - name: Publish four posts with featured images
        shell: bash
        run: |
          set -euo pipefail
          CAT_ID=$(cat /tmp/cat_id)

          api_post() {
            local path="$1"
            local body="$2"
            local out="$3"
            local status
            status=$(curl --silent --show-error --retry 5 --retry-delay 4 --retry-all-errors \
              -o "$out" -w "%{http_code}" \
              -X POST \
              -H "X-A3tal-Key: $A3TAL_API_KEY" \
              -H "Authorization: Bearer $A3TAL_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @"$body" \
              "$BASE$path")
            echo "POST $path -> HTTP $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              cat "$out"; exit 21
            fi
          }

          render_image() {
            local svg="$1"
            local key="$2"
            rsvg-convert -w 3840 -h 2160 "$svg" -o "/tmp/$key.png"
            cwebp -quiet -q 84 "/tmp/$key.png" -o "/tmp/$key.webp"
            identify_line=$(file "/tmp/$key.webp")
            echo "$identify_line"
            base64 -w 0 "/tmp/$key.webp" > "/tmp/$key.b64"
          }

          publish_one() {
            local key="$1"
            local title="$2"
            local slug="$3"
            local html="$4"
            local excerpt="$5"
            local focus="$6"
            local seo_title="$7"
            local seo_desc="$8"
            local svg="$9"
            local alt="10"

            jq -n \
              --arg title "$title" \
              --arg slug "$slug" \
              --rawfile content "$html" \
              --arg excerpt "$excerpt" \
              --arg focus "$focus" \
              --arg seo_title "$seo_title" \
              --arg seo_desc "$seo_desc" \
              --argjson cat "$CAT_ID" \
              '{
                title:$title,
                slug:$slug,
                type:"post",
                status:"draft",
                content:$content,
                excerpt:$excerpt,
                categories:[$cat],
                meta:{
                  "_yoast_wpseo_focuskw":$focus,
                  "_yoast_wpseo_title":$seo_title,
                  "_yoast_wpseo_metadesc":$seo_desc,
                  "_yoast_wpseo_opengraph-title":$seo_title,
                  "_yoast_wpseo_opengraph-description":$seo_desc
                }
              }' > "/tmp/$key-create.json"

            api_post "/create-post" "/tmp/$key-create.json" "/tmp/$key-create-response.json"
            POST_ID=$(jq -r '.id' "/tmp/$key-create-response.json")
            URL=$(jq -r '.link' "/tmp/$key-create-response.json")
            if [ -z "$POST_ID" ] || [ "$POST_ID" = "null" ]; then
              cat "/tmp/$key-create-response.json"; exit 22
            fi

            render_image "$svg" "$key"

            jq -n \
              --argjson post_id "$POST_ID" \
              --rawfile image_base64 "/tmp/$key.b64" \
              --arg filename "$key-featured.webp" \
              --arg title "$title" \
              --arg alt "$alt" \
              '{
                post_id:$post_id,
                image_base64:$image_base64,
                filename:$filename,
                title:$title,
                alt:$alt,
                set_featured:true,
                convert_webp:false
              }' > "/tmp/$key-image.json"

            api_post "/upload-image-data" "/tmp/$key-image.json" "/tmp/$key-image-response.json"
            MEDIA_ID=$(jq -r '.media_id' "/tmp/$key-image-response.json")
            MEDIA_URL=$(jq -r '.url' "/tmp/$key-image-response.json")
            echo "Media $MEDIA_ID $MEDIA_URL"

            jq -n --argjson id "$POST_ID" '{id:$id,status:"publish"}' > "/tmp/$key-publish.json"
            api_post "/update-post" "/tmp/$key-publish.json" "/tmp/$key-publish-response.json"
            URL=$(jq -r '.link' "/tmp/$key-publish-response.json")
            echo "$URL" > "/tmp/$key-url"
            echo "LIVE $key -> $URL"
          }

          publish_one \
            "dayun4a" \
            "دايون 4A 150 في مصر: المواصفات والعيوب ونقاط الفحص قبل الشراء" \
            "dayun-4a-150-egypt-review" \
            "/tmp/dayun.html" \
            "دليل عملي لدايون 4A 150 في مصر: المواصفات المتداولة، نقاط الفحص والعيوب المحتملة، المستعمل، الصيانة وملاءمته للدليفري." \
            "دايون 4A 150" \
            "دايون 4A 150 في مصر: المواصفات والعيوب قبل الشراء | أعطال.كوم" \
            "مراجعة دايون 4A 150 في مصر: المواصفات، نقاط الفحص، العيوب المحتملة، الصيانة، المستعمل والدليفري قبل قرار الشراء." \
            "/tmp/dayun.svg" \
            "دايون 4A 150 في مصر - صورة حصرية من أعطال.كوم"

          publish_one \
            "hogen3" \
            "هوجن 3 150 في مصر: المواصفات والعيوب والصيانة وقطع الغيار" \
            "hogen-3-150-egypt-review" \
            "/tmp/hogen.html" \
            "مراجعة هوجن 3 150 في مصر مع المواصفات المتداولة، نقاط فحص المستعمل، الصيانة، قطع الغيار والاستخدام اليومي والدليفري." \
            "هوجن 3 150" \
            "هوجن 3 150 في مصر: المواصفات والعيوب والصيانة | أعطال.كوم" \
            "دليل هوجن 3 150 في مصر: المواصفات، العيوب المحتملة، فحص المستعمل، الصيانة، قطع الغيار والمقارنة مع دايون 4A." \
            "/tmp/hogen.svg" \
            "هوجن 3 150 في مصر - صورة حصرية من أعطال.كوم"

          publish_one \
            "halawaexpress" \
            "حلاوة إكسبريس 150 في مصر: المواصفات والعيوب وهل يناسب الشغل اليومي؟" \
            "halawa-express-150-egypt-review" \
            "/tmp/halawa.html" \
            "دليل حلاوة إكسبريس 150 في مصر: المواصفات، نقاط الفحص والعيوب المحتملة، الصيانة، السعر المتغير وملاءمته للعمل والدليفري." \
            "حلاوة إكسبريس 150" \
            "حلاوة إكسبريس 150: المواصفات والعيوب قبل الشراء | أعطال.كوم" \
            "مراجعة حلاوة إكسبريس 150 في مصر: المواصفات، فحص المستعمل، الصيانة، العيوب المحتملة وهل يناسب الاستخدام اليومي والدليفري." \
            "/tmp/halawa.svg" \
            "حلاوة إكسبريس 150 في مصر - صورة حصرية من أعطال.كوم"

          publish_one \
            "haojika150" \
            "هاوجي KA 150 في مصر: المواصفات الرسمية وما يجب تأكيده قبل الشراء" \
            "haoji-ka150-egypt-review" \
            "/tmp/haoji.html" \
            "مراجعة هاوجي أو Haojue KA 150 في مصر بالمواصفات الرسمية، اختلافات تجهيز السوق المحلي، الصيانة ونقاط الاستلام قبل الشراء." \
            "هاوجي KA 150" \
            "هاوجي KA 150 في مصر: المواصفات الرسمية قبل الشراء | أعطال.كوم" \
            "دليل Haojue KA 150 في مصر: مواصفات المصنع، ما يختلف في بعض العروض المحلية، فحص الزيرو، الصيانة والسعر قبل الشراء." \
            "/tmp/haoji.svg" \
            "هاوجي Haojue KA 150 في مصر - صورة حصرية من أعطال.كوم"

      - name: Verify live pages SEO and images
        shell: bash
        run: |
          set -euo pipefail
          for key in dayun4a hogen3 halawaexpress haojika150; do
            URL=$(cat "/tmp/$key-url")
            echo "VERIFY $URL"
            HTML=$(curl -fsSL --retry 5 --retry-delay 3 "$URL")
            echo "$HTML" | grep -qi 'og:image' || { echo "Missing og:image: $URL"; exit 31; }
            echo "$HTML" | grep -qi 'canonical' || { echo "Missing canonical: $URL"; exit 32; }
            echo "$HTML" | grep -qi 'max-image-preview:large' || { echo "Missing max-image-preview large: $URL"; exit 33; }
            echo "$HTML" | grep -qi 'A3TAL' || true
          done

          echo "PUBLISHED_URLS"
          cat /tmp/dayun4a-url
          cat /tmp/hogen3-url
          cat /tmp/halawaexpress-url
          cat /tmp/haojika150-url

      - name: Verify category listing
        shell: bash
        run: |
          set -euo pipefail
          PAGE=$(curl -fsSL "$SITE/category/motorcycle-guide/")
          for needle in "دايون 4A 150" "هوجن 3 150" "حلاوة إكسبريس 150" "هاوجي KA 150"; do
            echo "$PAGE" | grep -Fq "$needle" || echo "Category cache may not yet show: $needle"
          done
