name: Publish Chinese Moto Batch 1

on:
  push:
    paths:
      - '.github/workflows/publish-chinese-moto-batch-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      A3TAL_API_KEY: \${{ secrets.A3TAL_BRIDGE_KEY }}
      BASE: https://a3tal.com/wp-json/a3tal-direct/v1
      SITE: https://a3tal.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"

      - name: Install image tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin webp jq

      - name: Prepare articles and exclusive artwork
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/dayun.html <<'HTML'
          <p><strong>دايون 4A 150</strong> من الأسماء التي يعرفها سوق الموتوسيكلات الاقتصادي في مصر منذ سنوات، وخصوصًا لدى من يريد دراجة بسيطة في فكرتها، سهلة نسبيًا في الصيانة، وتصلح للمشاوير اليومية أو العمل الخفيف والمتوسط. لكن شهرة الموديل لا تعني أن كل نسخة معروضة للبيع متطابقة، ولا أن أي رقم متداول على الإنترنت يصلح لكل سنة إنتاج. في السوق المصري توجد فروق بين دفعات التجميع، وسنوات الموديل، وحالة الدراجة، كما أن كثيرًا من المعلومات المتداولة تُنسخ من صفحات قديمة بدون التحقق من النسخة الموجودة أمام المشتري.</p>
          <p>لذلك هذا الدليل لا يكتفي بعبارة «دايون 4 كويس ولا وحش؟». سنفصل بين المواصفات المؤكدة على مستوى الفئة، والأرقام التي تختلف بين المصادر، ثم نركز على ما يهمك قبل الشراء: التشغيل البارد، حالة المحرك والكربراتير، الفتيس والدبرياج، الكهرباء، السلسلة والتروس، الفرامل، الشاسيه، وتكلفة إعادة الدراجة لحالة جيدة إذا كانت مستعملة.</p>

          <h2>مواصفات دايون 4A 150 التي يمكن الاعتماد عليها</h2>
          <table>
            <thead><tr><th>البند</th><th>المعلومة</th><th>ملاحظة أعطال.كوم</th></tr></thead>
            <tbody>
              <tr><td>السعة</td><td>نحو 150 سي سي</td><td>المصادر المصرية وقواعد بيانات السوق تتفق على الفئة 150 سي سي.</td></tr>
              <tr><td>المحرك</td><td>أسطوانة واحدة، 4 أشواط</td><td>تصميم اقتصادي شائع في فئة commuter الصينية.</td></tr>
              <tr><td>التبريد</td><td>هواء</td><td>يعني أن نظافة الزعانف وجودة الزيت مهمتان مع الزحام والحرارة.</td></tr>
              <tr><td>الفتيس</td><td>يدوي</td><td>افحص التعشيق تحت حمل خفيف قبل الشراء.</td></tr>
              <tr><td>التغذية</td><td>كربراتير في النسخ الشائعة محليًا</td><td>اضبطه حسب حالة المحرك ولا تعالج كل تقطيع بتكبير البنزين.</td></tr>
              <tr><td>الاستخدام</td><td>تنقل يومي وأعمال خفيفة/متوسطة</td><td>الحمولة وساعات التشغيل تغيران خطة الصيانة جذريًا.</td></tr>
            </tbody>
          </table>
          <p>ستجد أرقامًا مختلفة للقدرة والوزن وسعة الخزان بين مواقع السوق وتغطيات قديمة. لهذا لا نثبت رقمًا واحدًا كحقيقة لكل دايون 4A في مصر. رقم المحرك ولوحة البيانات وكتيب النسخة الموجودة أمامك أقوى من أي جدول منسوخ، بما في ذلك هذا المقال لو كانت الدراجة من دفعة مختلفة.</p>

          <h2>لماذا ظل دايون 4 منتشرًا في مصر؟</h2>
          <p>أكبر نقطة قوة للموديل ليست رفاهية أو إلكترونيات متقدمة، بل بساطة المنظومة. محرك صغير مبرد بالهواء، كربراتير، سلسلة، فتيس يدوي، وهيكل مألوف للفنيين. هذا لا يجعل الأعطال مستحيلة، لكنه يجعل التشخيص والإصلاح في كثير من الحالات أقل تعقيدًا من دراجة مليئة بأنظمة إلكترونية غير مألوفة. انتشار الفئة يساعد كذلك في وجود بدائل كثيرة لقطع الاستهلاك، لكن لا تفترض أن كل قطعة مكتوب عليها «150 صيني» تركب من غير مراجعة المقاس أو كود المحرك. راجع دليلنا عن <a href="https://a3tal.com/motorcycle-genuine-vs-aftermarket-parts/">الأصلي والـAftermarket والقطع التجارية للموتوسيكل</a>.</p>

          <h2>عيوب دايون 4A: ما الذي يستحق الفحص فعلًا؟</h2>
          <p>قوائم «العيوب» على السوشيال ميديا تخلط عادة بين عيب تصميم، وإهمال صيانة، وتلف طبيعي في دراجة اشتغلت سنوات. في دايون 4A الأهم هو فحص نقاط عملية بدل إصدار حكم على الاسم كله:</p>
          <ul>
            <li><strong>الاهتزاز والأصوات:</strong> بعض الاهتزاز طبيعي في محرك أسطوانة واحدة، لكن زيادة الاهتزاز مع رجة أو صوت معدني تستلزم فحص قواعد المحرك والعادم والسلسلة وحالة المحرك نفسه.</li>
            <li><strong>الكربراتير والسلانسيه:</strong> صعوبة التشغيل البارد أو التقطيع قد تأتي من ضبط الكربراتير، فلتر الهواء، بوجيه، بنزين قديم أو تسريب هواء. لا تبدأ بتغيير قطع عشوائيًا.</li>
            <li><strong>الشحن والكهرباء:</strong> بطارية ضعيفة، أرضي سيئ أو منظم شحن متعب يمكن أن يصنع سلسلة أعراض تبدو كأنها أعطال متعددة.</li>
            <li><strong>السلسلة والتروس:</strong> الإهمال يظهر في صوت، نتش، مناطق شد مختلفة وأسنان تروس حادة. فحصها يخبرك أيضًا كيف كان المالك يعامل الدراجة.</li>
            <li><strong>المسامير والعادم والحوامل:</strong> الاستخدام الخشن والاهتزاز لفترات طويلة قد يرخيان تثبيتات أو يسببان شروخًا في حوامل تعرضت لتحميل غير مناسب.</li>
          </ul>

          <h2>فحص دايون 4 مستعمل قبل ما تدفع</h2>
          <p>ابدأ بالأوراق ورقم الشاسيه والمحرك قبل الانبهار بطلاء جديد. بعد ذلك اطلب أن يكون المحرك باردًا قدر الإمكان. التشغيل من أول لمسة ليس شرطًا سحريًا، لكنك تريد ملاحظة زمن التشغيل، الدخان، صوت التاكيهات أو الخبطات غير الطبيعية، وثبات السلانسيه بعد التسخين. افحص أي تهريب زيت حول جوانات المحرك، غطاء البلوف، عمود الفتيس ومنطقة ترس الجر.</p>
          <ol>
            <li>طابق أرقام الشاسيه والمحرك مع المستندات.</li>
            <li>افحص استقامة الشاسيه والدركسيون وآثار اللحام غير الأصلي.</li>
            <li>شغّل باردًا وراقب الدخان والصوت والتقطيع.</li>
            <li>جرّب الغيارات كلها والدبرياج تحت حمل طبيعي.</li>
            <li>افحص السلسلة والتروس ومقدار الشد في أكثر من نقطة.</li>
            <li>اختبر الفرامل الأمامية والخلفية بدون جذب أو صوت مبالغ فيه.</li>
            <li>راجع المساعدين لأي زيت أو ارتداد غير طبيعي.</li>
            <li>شغّل النور والإشارات والكلاكس والمارش وافحص جهد الشحن لدى فني.</li>
            <li>راجع تاريخ الإطارات والتشققات وليس عمق النقشة فقط.</li>
            <li>جرّب الدراجة في خط مستقيم واستمع لأي صوت من بلي العجل أو الدركسيون.</li>
          </ol>
          <p>لدينا أيضًا <a href="https://a3tal.com/used-motorcycle-buying-checklist-egypt/">Checklist كامل لشراء موتوسيكل مستعمل</a> يمكن استخدامه مع أي موديل.</p>

          <h2>الصيانة التي تصنع الفرق في دايون 4A</h2>
          <p>محرك بسيط لا يعني إهمال الزيت. استخدم اللزوجة والمواصفة التي يحددها كتيب نسختك، وراجع المستوى والتسريب دوريًا، خصوصًا مع التشغيل الطويل في الحر والزحام. نظف أو استبدل فلتر الهواء حسب البيئة، واضبط السلسلة وشحمها بالطريقة الصحيحة، وراجع خلوص الدبرياج والفرامل. لو الدراجة تعمل دليفري، فعدد ساعات التشغيل والتوقف والانطلاق أهم من رقم الكيلومترات وحده. راجع <a href="https://a3tal.com/motorcycle-maintenance-schedule-guide/">جدول صيانة الموتوسيكل</a> كإطار عام، ثم ارجع لكتيب الموديل للفترات الدقيقة.</p>

          <h2>هل دايون 4 مناسب للدليفري؟</h2>
          <p>يمكن أن يكون منطقيًا بسبب البساطة وانتشار الخبرة به، لكن القرار لا يُبنى على سعر الشراء فقط. احسب استهلاك قطع الفرامل والسلسلة والتروس والإطارات والدبرياج، وراقب وضعية الجلوس بعد ساعات، وقدرة الحامل الخلفي وحدوده. تركيب صندوق ثقيل أو تحميل زائد يرفع الضغط على الشاسيه والمساعدين والفرامل. لو الاستخدام تجاري يومي، اقرأ <a href="https://a3tal.com/delivery-motorcycle-buying-guide/">دليل اختيار موتوسيكل للدليفري</a> قبل المقارنة.</p>

          <h2>سعر دايون 4 في مصر: لماذا لن نعطيك رقمًا واحدًا؟</h2>
          <p>لأن السوق نفسه لا يعطي رقمًا واحدًا. بعض صفحات الأسعار ما زالت تعرض مرجعًا لموديل 2023، بينما إعلانات المستعمل خلال 2026 تُظهر نطاقات كبيرة تتأثر بسنة الصنع، الترخيص، حالة المحرك، الكيلومترات الحقيقية، وحجم التعديلات. لذلك تعامل مع السعر كـ«لقطة سوق» يوم الشراء، لا كقيمة ثابتة في مقال. السعر المنخفض جدًا قد يخفي مصروفًا كبيرًا في المحرك أو الأوراق، والسعر المرتفع لا يضمن حالة ممتازة من تلقاء نفسه.</p>

          <h2>دايون 4A أم هوجن 3؟</h2>
          <p>المقارنة الصحيحة تبدأ بحالة الدراجة الفعلية وتوفر القطع التي تحتاجها في منطقتك. لو أمامك وحدتان مستعملتان، دايون بحالة ممتازة غالبًا أفضل من هوجن مهمل والعكس صحيح. أما في الزيرو أو كسر الزيرو، قارن الفئة الفعلية، جودة التجميع، الفرامل، الإطارات، الضمان وخدمة ما بعد البيع. جهزنا دليلًا مستقلًا عن <a href="https://a3tal.com/hogen-3-150-egypt-review/">هوجن 3 150 في مصر</a> بدل دفن المقارنة في خمس سطور عامة.</p>

          <h2>أسئلة شائعة عن دايون 4A 150</h2>
          <h3>هل دايون 4A اعتمادي؟</h3>
          <p>يمكن أن يخدم لفترة طويلة إذا كانت حالته جيدة والصيانة منتظمة، لكن كلمة «اعتمادي» لا تلغي أثر الزيت الرديء، التحميل الزائد، ضبط الكربراتير السيئ أو إهمال السلسلة والفرامل. في المستعمل، حالة الوحدة أهم من سمعة الاسم وحدها.</p>
          <h3>هل قطع غيار دايون 4 متوفرة؟</h3>
          <p>الفئة منتشرة وقطع كثيرة متداولة في السوق، لكن لا تعتمد على التشابه البصري. طابق كود المحرك، مقاس القطعة والفيش أو أرقامها قبل الشراء، خصوصًا في الكهرباء ومكونات المحرك والفرامل.</p>
          <h3>هل 150 سي سي تكفي للمشاوير اليومية؟</h3>
          <p>للاستخدام داخل المدينة والمشاوير المعتادة، فئة 150 سي سي شائعة ومنطقية. الأداء الفعلي يتأثر بالوزن والحمولة وحالة المحرك ونسب التروس، لذلك لا تختصر الاختيار في رقم السعة فقط.</p>
          <h3>ما أهم شيء أفحصه في دايون 4 مستعمل؟</h3>
          <p>الأوراق والشاسيه أولًا، ثم تشغيل بارد، دخان وصوت المحرك، الفتيس والدبرياج، الكهرباء والشحن، السلسلة والتروس، الفرامل والإطارات. أي عيب كبير في الشاسيه أو الأوراق يسبق مناقشة السعر.</p>
          <h3>هل أشتري دايون 4 قديم بحالة ممتازة أم موديل أحدث متعب؟</h3>
          <p>غالبًا الحالة والتاريخ المعروف للصيانة أهم من سنة الموديل وحدها. موديل أحدث تعرّض لحادث أو تشغيل قاسٍ يمكن أن يكون أسوأ بكثير من دراجة أقدم مصانة ومفحوصة جيدًا.</p>

          <h2>مصادر ومراجعة البيانات</h2>
          <p>تمت مراجعة مواصفات الفئة وحضورها في السوق المصري بالرجوع إلى صفحات دايون 4A في هتلاقي، وإعلانات سوق حديثة في يوجد، وقواعد بيانات مقارنة الموتوسيكلات. أي رقم يختلف بين دفعات الإنتاج يجب تأكيده من لوحة الدراجة وكتيبها قبل قرار الشراء.</p>
          HTML

          cat > /tmp/hogen.html <<'HTML'
          <p><strong>هوجن 3 150</strong> أو Haojiang 3 من الموديلات الصينية التي تحولت في السوق المصري إلى اسم مألوف أكثر من كونها مجرد مواصفة على ورق. الباحث عنه عادة لا يريد معرفة أن المحرك 150 سي سي فقط، بل يريد إجابة عملية: هل يصلح للاستخدام اليومي؟ ما الذي يُفحص في المستعمل؟ هل قطع الغيار موجودة؟ وهل الكلام المتداول عن العيوب مشكلة تصميم فعلًا أم نتيجة استخدام وصيانة؟</p>
          <p>المصادر السوقية المصرية الحالية تصف النسخ الشائعة بمحرك في فئة 149–150 سي سي، أسطوانة واحدة، أربع أشواط، تبريد هواء وكربراتير، وتعرض بعض القواعد قدرة تقارب 12 حصانًا وعزمًا في حدود 11.5 نيوتن متر. لكن لأن المواصفات قد تختلف بين سنة وأخرى ودفعة وأخرى، سنعامل هذه الأرقام كمرجع سوقي لا كبديل عن بطاقة المواصفات للدراجة التي ستشتريها.</p>

          <h2>مواصفات هوجن 3 150 في السوق المصري</h2>
          <table>
            <thead><tr><th>البند</th><th>المتوفر في المصادر المصرية</th><th>ماذا تفعل قبل الشراء؟</th></tr></thead>
            <tbody>
              <tr><td>السعة</td><td>149–150 سي سي</td><td>راجع رقم المحرك والبيانات المثبتة على الوحدة.</td></tr>
              <tr><td>المحرك</td><td>أسطوانة واحدة، 4 أشواط، تبريد هواء</td><td>افحص التسريب والدخان والصوت باردًا وساخنًا.</td></tr>
              <tr><td>الوقود</td><td>كربراتير في النسخ المتداولة</td><td>اختبر التشغيل البارد واستقرار السلانسيه.</td></tr>
              <tr><td>الفتيس</td><td>5 سرعات في قواعد بيانات مصرية</td><td>جرّب كل غيار ولا تكتفِ بلفة قصيرة على الأول والثاني.</td></tr>
              <tr><td>التعليق</td><td>توجد نسخ مع 4 مساعدين وفق عروض محلية</td><td>راجع العدد والتجهيز الفعلي للدراجة أمامك.</td></tr>
              <tr><td>الاستخدام</td><td>تنقل يومي وفئة commuter</td><td>العمل الشاق يحتاج حساب صيانة وقطع استهلاك.</td></tr>
            </tbody>
          </table>

          <h2>هوجن 3 في الاستخدام اليومي</h2>
          <p>الفئة موجهة أساسًا للمدينة، وهذا يظهر في بساطة المحرك ووضعية القيادة وسهولة التعامل مقارنة بموتوسيكلات أثقل. داخل الزحام لا تحتاج إلى أرقام سرعة قصوى بقدر ما تحتاج إلى استجابة متوقعة للدبرياج، فتيس سليم، فرامل بحالة جيدة، وإطار غير متحجر. المحرك الأحادي قد ينقل قدرًا من الاهتزاز، لذلك فرّق بين اهتزاز طبيعي يزداد مع الـRPM وبين رجة نتيجة حامل محرك، عادم مفكوك، عجلة غير موزونة أو سلسلة حالتها سيئة.</p>

          <h2>هل هوجن 3 له عيوب مشهورة؟</h2>
          <p>الأدق أن نتكلم عن <strong>نقاط فحص متكررة</strong> بدل إلصاق عيوب بكل الوحدات. السوق المصري مليء بدراجات اشتغلت استخدامات مختلفة، من طالب يركبها عشرين كيلومترًا يوميًا إلى دليفري يعمل ساعات طويلة. لهذا راقب:</p>
          <ul>
            <li><strong>التشغيل والسلانسيه:</strong> لو يحتاج بنزينًا زائدًا أو يفصل بعد التسخين، افحص الكربراتير وفلتر الهواء والبوجيه والتسريب الهوائي قبل الحكم على المحرك.</li>
            <li><strong>الدبرياج والفتيس:</strong> انزلاق الدبرياج يظهر تحت الحمل، ومشكلة التعشيق قد لا تظهر في تجربة قصيرة.</li>
            <li><strong>المساعدين:</strong> أي تسريب أو ارتداد زائد أو صوت خبط يحتاج تقييمًا، خصوصًا إذا كانت الدراجة تحمل أوزانًا باستمرار.</li>
            <li><strong>الكهرباء:</strong> افحص البطارية والمنظم والدينامو والأرضي بدل تغيير البطارية كلما ضعف المارش.</li>
            <li><strong>الفرامل والإطارات:</strong> اسم الموديل لا ينقذك من تيل منتهي أو كاوتش عمره كبير.</li>
          </ul>

          <h2>قطع غيار هوجن 3: هل هي موجودة فعلًا؟</h2>
          <p>وجود قوائم حديثة في متاجر قطع غيار مصرية لقطع كهرباء، مارش، بساتم، سلندر، كربراتير، مساعدين ومكونات فرامل خاصة بهوجن 3 مؤشر عملي على أن الموديل ليس يتيمًا في السوق. لكن «التوفر» لا يعني أن كل جودة واحدة. ستجد أصليًا وAftermarket وتجاريًا بدرجات متعددة، وقد تجد قطعة تشبه المطلوبة ولا تطابقها. استخدم كود المحرك والمقاسات وراجع <a href="https://a3tal.com/motorcycle-genuine-vs-aftermarket-parts/">دليل اختيار قطع غيار الموتوسيكل</a> قبل شراء مكون حساس.</p>

