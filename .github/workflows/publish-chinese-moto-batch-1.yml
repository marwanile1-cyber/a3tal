          <p>لا تنقل موعد تغيير الزيت من صاحب موتوسيكل آخر لمجرد أن السعة 150 سي سي. نوع الزيت، سعته، ظروف التشغيل، حرارة الجو وحالة المحرك كلها عوامل مؤثرة. اتبع دليل النسخة المتاحة لديك، وراقب المستوى بين التغييرات. افحص فلتر الهواء والبوجيه وضبط الكربراتير والسلسلة والفرامل دوريًا. لو تسمع صوتًا جديدًا، شخص السبب قبل «تعلية» السلانسيه أو زيادة البنزين لإخفائه؛ هذا علاج تجميلي لمشكلة قد تكبر.</p>

