name: Final read-only DTC batch38 SEO image and canonical audit
on:
  workflow_run:
    workflows: ['Save Yoast SEO descriptions DTC batch38']
    types: [completed]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate all ten live WordPress pages, their canonical URLs and WebP OpenGraph
        shell: python
        run: |
          import urllib.request,urllib.parse,json,time
          codes="P0361 P0362 P0363 P0486 P0487 P0488 P0764 P0766 P0767 P0768".split()
          def read(url):
              req=urllib.request.Request(url,headers={"User-Agent":"A3tal-DTC38-FinalAudit/20261031","Cache-Control":"no-cache","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=55) as resp:return json.load(resp)
          for code in codes:
              q=urllib.parse.urlencode({"slug":code.lower(),"per_page":4,"_fields":"id,slug,status,featured_media,yoast_head_json,link"})
              rows=read("https://a3tal.com/wp-json/wp/v2/a3tal-dtc?"+q)
              exact=[r for r in rows if r.get("slug")==code.lower()]
              assert len(exact)==1,(code,"missing or duplicate live posts",rows)
              row=exact[0];assert row["status"]=="publish",code
              expected="https://a3tal.com/dtc/"+code.lower()+"/"
              assert row["link"]==expected,(code,"permalink mismatch")
              media_id=int(row.get("featured_media") or 0)
              assert media_id>0,(code,"no featured image")
              media=read("https://a3tal.com/wp-json/wp/v2/media/"+str(media_id)+"?_fields=id,source_url,mime_type")
              assert media.get("mime_type")=="image/webp" and media.get("source_url","").endswith(".webp"),(code,"non-WebP image")
              seo=row.get("yoast_head_json") or {}
              assert (seo.get("canonical") or "").rstrip("/")==expected.rstrip("/"),(code,"wrong canonical")
              assert media["source_url"] in [x.get("url") for x in seo.get("og_image",[]) if isinstance(x,dict)],(code,"wrong OG")
              robots=seo.get("robots") or {}
              assert "noindex" not in json.dumps(robots).lower(),(code,"noindex")
              print("DTC38_LIVE_PASS",code,expected,"featured_media",media_id,"og",media["source_url"],flush=True)
              time.sleep(.4)
          print("DTC38_ALL_TEN_PUBLISHED_WEBP_OG_CANONICAL_INDEXABILITY_VERIFIED",flush=True)
