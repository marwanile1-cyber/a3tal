name: Publish five reviewed original DTC guides - Batch 08

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-original-dtc-batch-08.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3tal-production-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate unique original diagnostics and block duplicate codes
        run: |
          python3 -m py_compile scripts/publish-dtc-original-batch-08.py
          python3 scripts/publish-dtc-original-batch-08.py --dry-run
      - name: Publish through reviewed Direct Bridge with live duplicate preflight
        run: python3 -u scripts/publish-dtc-original-batch-08.py --from-index 1
