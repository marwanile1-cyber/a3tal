name: Publish two original motorcycle fault diagnosis guides
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-motorcycle-faults-20261102.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-motorcycle-faults-20261102
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install photo editor
        run: python3 -m pip install --quiet Pillow
      - name: Preflight protected publishing and articles
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          test -s data/editorial/motorcycle-blue-exhaust-smoke-oil-loss-20261102.html
          test -s data/editorial/motorcycle-brakes-dragging-wheel-hot-20261102.html
          python3 -m py_compile scripts/publish-motorcycle-faults-20261102.py
      - name: Publish two reviewed motorcycle fault posts with photo, canonical and OG verification
        run: python3 -u scripts/publish-motorcycle-faults-20261102.py
