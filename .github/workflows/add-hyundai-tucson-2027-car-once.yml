name: Add Tucson 2027 to Cars Encyclopedia once

on:
  push:
    branches:
      - main
    paths:
      - scripts/add-hyundai-tucson-2027-car.py
      - .github/workflows/add-hyundai-tucson-2027-car-once.yml

permissions:
  contents: read

concurrency:
  group: a3tal-tucson-2027-vehicle-hub
  cancel-in-progress: false

jobs:
  publish-car:
    if: >-
      github.event_name == 'push' && github.event.head_commit.message == 'publish: Tucson 2027 encyclopedia entry'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check car installer
        run: python3 -m py_compile scripts/add-hyundai-tucson-2027-car.py
      - name: Publish one verified Tucson entity through A3tal Direct Bridge
        run: python3 -u scripts/add-hyundai-tucson-2027-car.py
