name: A3tal Egypt homepage show only indexable car-reference guides
on:
  push:
    branches: [main]
    paths:
      - 'theme-source/a3tal-global/home-reference-20261104.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-egypt-home-indexable-refs-20261121
  cancel-in-progress: false
jobs:
  surgical-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository PHP
        run: php -l theme-source/a3tal-global/home-reference-20261104.php
      - name: Patch only the stale homepage reference query using protected Direct Bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/a3tal-egypt-home
          cat > /tmp/fix_a3tal_home_ref.py <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, time, urllib.request
          if not os.environ.get("A3TAL_API_KEY"):
              raise SystemExit("Missing A3TAL_API_KEY; no write")
          SOURCE = pathlib.Path("theme-source/a3tal-global/home-reference-20261104.php").read_text(encoding="utf-8")
          FILE = "themes/a3tal-global/home-reference-20261104.php"
          MARK = "// Only count and display indexable car-reference records after 393 fact-card merges."
          old = """// Reuse existing, already stable homepage car query; avoid extra home data scans.
          $home_new_reference = post_type_exists('a3_car_ref') ? get_posts([
           'post_type'=>'a3_car_ref','post_status'=>'publish','numberposts'=>6,
           'orderby'=>'modified','order'=>'DESC'
          ]) : [];
          if (post_type_exists('a3_car_ref')) {
              $ref_stats = wp_count_posts('a3_car_ref');
              $ref_count = isset($ref_stats->publish) ? (int) $ref_stats->publish : 0;
          }"""
          hit = re.search(re.escape(MARK) + r".*?(?=\n\?>)", SOURCE, flags=re.S)
          if not hit or SOURCE.count(MARK) != 1 or old in SOURCE:
              raise SystemExit("GitHub source is not the expected audited fix")
          new = hit.group(0).rstrip()
          def bridge(body):
              command=["curl","--fail","--silent","--show-error","--retry","3","--retry-all-errors","--retry-delay","2","--connect-timeout","15","--max-time","110","-X","POST",
                      "-H","X-A3tal-Key: "+os.environ["A3TAL_API_KEY"],"-H","Content-Type: application/json",
                      "--data-binary","@-","https://a3tal.com/wp-json/a3tal-direct/v1/admin"]
              r=subprocess.run(command,input=json.dumps(body,ensure_ascii=False).encode(),capture_output=True,timeout=130)
              if r.returncode:
                  raise RuntimeError("Bridge request failed: "+r.stderr.decode("utf-8","replace")[:160])
              j=json.loads(r.stdout.decode("utf-8"))
              if not j.get("ok") or not isinstance(j.get("result"),dict):
                  raise RuntimeError("Bridge rejected file operation: "+str(j.get("message","unknown")))
              return j["result"]
          current=bridge({"op":"file_read","path":FILE})
          live=current.get("content","")
          sha=current.get("sha256","")
          if current.get("path") != FILE or hashlib.sha256(live.encode("utf-8")).hexdigest()!=sha:
              raise SystemExit("Live read/checksum mismatch; no writes")
          pathlib.Path("diagnostics/a3tal-egypt-home/before-home-reference-20261121.php").write_text(live,encoding="utf-8")
          if live.count(new)==1 and old not in live:
              print("ALREADY_PATCHED idempotent; unchanged")
          else:
              if live.count(old)!=1 or MARK in live:
                  raise SystemExit("Unexpected theme source drift: old code not exact or marker conflicts. No write.")
              updated=live.replace(old,new,1)
              changed_path=pathlib.Path("/tmp/a3tal-home-indexable-ref-20261121.php")
              changed_path.write_text(updated,encoding="utf-8")
              lint=subprocess.run(["php","-l",str(changed_path)],capture_output=True,text=True)
              if lint.returncode:
                  raise SystemExit("PHP lint failed: "+lint.stderr)
              response=bridge({"op":"file_write","path":FILE,"content":updated,"expected_sha256":sha,"confirm":True,"dangerous":True})
              expected=hashlib.sha256(updated.encode("utf-8")).hexdigest()
              if response.get("sha256") != expected:
                  raise SystemExit("Write response checksum did not match")
              reread=bridge({"op":"file_read","path":FILE})
              if reread.get("sha256")!=expected or reread.get("content")!=updated:
                  raise SystemExit("Read-after-write mismatch")
              print("LIVE_HOMEPAGE_REFERENCE_QUERY_PATCHED",expected)
          # Public read-only verification; cache can temporarily serve an older page.
          for attempt in range(5):
              req=urllib.request.Request("https://a3tal.com/?home-indexable-check="+str(int(time.time())),
                headers={"User-Agent":"A3tal-Egypt-SEO-QA/1.0","Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=40) as f:
                      html=f.read().decode("utf-8","replace")
              except Exception as e:
                  print("Public verification retry",type(e).__name__)
                  time.sleep(7)
                  continue
              match=re.search(r"([0-9٠-٩]+) صفحة مواصفات فنية منشورة",html)
              if match and match.group(1) not in ("455","٤٥٥"):
                  print("PUBLIC_HOMEPAGE_COUNT",match.group(1))
                  break
              print("Public cache still displays legacy count; source readback verified, retry",attempt+1)
              time.sleep(7)
          else:
              print("WARNING: public response remained cached/unconfirmed; live PHP source has been verified")
          PY
          python3 -u /tmp/fix_a3tal_home_ref.py
      - name: Preserve predeployment theme backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3tal-egypt-home-reference-before-20261121
          path: diagnostics/a3tal-egypt-home/before-home-reference-20261121.php
          if-no-files-found: warn
          retention-days: 90
