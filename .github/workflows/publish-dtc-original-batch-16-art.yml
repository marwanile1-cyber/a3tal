name: Attach five original mixed DTC batch16 featured images
on:
  workflow_run:
    workflows:
      - Publish original mixed DTC batch16 Arabic guides
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-production-media
  cancel-in-progress: false
jobs:
  artwork:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install original illustration renderer
        run: python3 -m pip install -q pillow
      - name: Validate local five WebP files before writing to site
        run: |
          python3 - <<'PY'
          import runpy
          from PIL import Image
          from io import BytesIO
          n=runpy.run_path('scripts/attach-dtc-batch-16-art.py')
          for code in n['CODES']:
            raw=n['image_for'](code)
            im=Image.open(BytesIO(raw))
            assert im.format=='WEBP' and im.size==(1200,800) and len(raw)>10000
            print('ART VERIFIED',code,len(raw))
          PY
      - name: Attach images only to five known uniquely published post slugs
        run: python3 -u scripts/attach-dtc-batch-16-art.py
      - name: Synchronize post featured pictures to Yoast og:image
        run: python3 -u scripts/repair-dtc-og-canary.py --batch 16
      - name: Verify original featured, article image and OpenGraph on each post
        run: python3 -u scripts/audit-dtc-og-images.py --batch 16
