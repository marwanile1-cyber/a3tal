name: Validate DTC batch19 original P U C B
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-dtc-batch-19.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Validate five distinct well-referenced 1P 2U 1C 1B articles
        run: |
          python3 -m py_compile scripts/publish-dtc-original-batch-19.py scripts/attach-dtc-batch-19-art.py
          python3 scripts/publish-dtc-original-batch-19.py --dry-run
      - name: Install illustration rendering support
        run: python3 -m pip install -q pillow
      - name: Render five distinct images of real diagnostics concepts
        run: |
          python3 - <<'PY'
          import runpy,json
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          obj=json.loads(Path('data/dtc-original-batch-19.json').read_text())
          codes=[r['code'] for r in obj['items']]
          assert codes==['P0544','U0104','U0111','C0299','B0095']
          art=runpy.run_path('scripts/attach-dtc-batch-19-art.py')
          assert art['CODES']==codes
          seen=set()
          for code in codes:
            raw=art['image_for'](code)
            im=Image.open(BytesIO(raw))
            assert im.format=='WEBP' and im.size==(1200,800) and 10000<len(raw)<450000
            assert raw not in seen
            seen.add(raw)
            print('COVER PASS',code,len(raw))
          PY
