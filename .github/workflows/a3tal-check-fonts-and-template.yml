name: A3tal font and live-template diagnostics
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/a3tal-check-fonts-and-template.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only compare live code and candidate fonts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,json,hashlib
          base='https://a3tal.com/wp-json/a3tal-direct/v1/admin?op=file_read&path='
          path='themes/a3tal-global/dtc-library-single.php'
          url=base+path
          secret=os.environ['A3TAL_API_KEY']
          req=urllib.request.Request(url,headers={'X-A3tal-Key':secret,'Authorization':'Bearer '+secret})
          source=open('theme-source/a3tal-global/dtc-library-single.php','rb').read()
          try:
            d=json.load(urllib.request.urlopen(req,timeout=45))
            print('DTC_TEMPLATE_COMPAT',json.dumps({'ok':d.get('ok'),'live_sha256':d.get('result',{}).get('sha256'),'repo_sha256':hashlib.sha256(source).hexdigest(),'same':d.get('result',{}).get('sha256')==hashlib.sha256(source).hexdigest()}),flush=True)
          except Exception as e:
            print('DTC_TEMPLATE_PROBE_BLOCKED',str(e)[:100],flush=True)
          fonts={
           'current':'https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap',
           'variable':'https://fonts.googleapis.com/css2?family=Alexandria:wght@500..800&family=IBM+Plex+Sans+Arabic:wght@400..700&display=swap',
           'reduced':'https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap',
          }
          for kind,url in fonts.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36'})
            try:
              content=urllib.request.urlopen(req,timeout=25).read().decode()
              print('FONT_OPTION',json.dumps({'kind':kind,'css_bytes':len(content.encode()),'alexandria_faces':content.count("font-family: 'Alexandria'"),'ibm_faces':content.count("font-family: 'IBM Plex Sans Arabic'"),'url_count':content.count('url('),'css_preview':content[:160]}),flush=True)
            except Exception as e:print('FONT_OPTION_FAILED',kind,str(e)[:240],flush=True)
          PY
