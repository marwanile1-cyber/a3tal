name: Astra J A14NET MPI original educational diagnostic image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-egypt-astra-j-14-mpi-diagram-20261020.yml'
      - 'scripts/attach-egypt-astra-j-14-mpi-original-diagram-20261020.py'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow arabic-reshaper python-bidi
      - name: Create, attach and verify an exclusive WebP diagnostic visual in Astra J
        run: python3 -u scripts/attach-egypt-astra-j-14-mpi-original-diagram-20261020.py
