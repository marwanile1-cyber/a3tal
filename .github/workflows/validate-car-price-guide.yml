name: Validate A3tal car price guide
on:
  pull_request:
    paths:
      - 'theme-source/a3tal-global/car-price-guide.php'
      - 'theme-source/a3tal-global/car-price-guide.css'
      - 'theme-source/a3tal-global/car-price-guide.js'
      - 'theme-source/a3tal-global/car-price-brand-logos.js'
      - 'theme-source/a3tal-global/archive-a3_car.php'
      - 'scripts/deploy-car-price-guide.py'
      - 'theme-source/a3tal-global/platform-single-vehicle.php'
      - 'theme-source/a3tal-global/car-price-trims.php'
      - 'theme-source/a3tal-global/car-price-trims.css'
      - 'scripts/audit-car-prices-all.py'
      - '.github/workflows/audit-car-prices-all.yml'
      - 'scripts/audit-car-prices-top10.py'
      - '.github/workflows/audit-car-prices-top10.yml'
      - '.github/workflows/deploy-car-price-guide.yml'
      - '.github/workflows/validate-car-price-guide.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax checks
        run: |
          set -euo pipefail
          php -l theme-source/a3tal-global/car-price-guide.php
          php -l theme-source/a3tal-global/archive-a3_car.php
          php -l theme-source/a3tal-global/car-price-trims.php
          php -l theme-source/a3tal-global/platform-single-vehicle.php
          node --check theme-source/a3tal-global/car-price-guide.js
          node --check theme-source/a3tal-global/car-price-brand-logos.js
          python3 -m py_compile scripts/deploy-car-price-guide.py scripts/audit-car-prices-top10.py scripts/audit-car-prices-all.py
      - name: Link and data provenance guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('theme-source/a3tal-global/car-price-guide.php').read_text()
          archive=Path('theme-source/a3tal-global/archive-a3_car.php').read_text()
          css=Path('theme-source/a3tal-global/car-price-guide.css').read_text()
          for needle in ['a3cp_vehicle_price','a3g_first_term','_a3_source_checked_at','get_permalink','get_post_type_archive_link', "cat'=>374", 'a3g_cat_link(21)',"a3g_platform_link('a3_listing'"]:
              assert needle in p,needle
          assert 'car-price-guide.php' in archive
          trim=Path('theme-source/a3tal-global/car-price-trims.php').read_text()
          single=Path('theme-source/a3tal-global/platform-single-vehicle.php').read_text()
          assert "get_post_type($post_id) !== 'a3_car'" in trim
          assert "_a3_source_checked_at" in trim and "_a3_source_url" in trim
          assert "_a3_trim_prices_v1" in trim and "count($rows)>24" in trim
          assert "a3tal_car_render_trims" in single
          assert "if (!$is_moto)" in single
          assert "platform-single-vehicle.php" in Path('scripts/deploy-car-price-guide.py').read_text()
          assert "car-price-trims.php" in Path('scripts/deploy-car-price-guide.py').read_text()
          assert 'name="car_year"' in p
          assert "get_query_var('year')" not in p
          assert "isset($_GET['year'])" not in p
          assert "'car_year'=>$cg_year" in p
          assert "'_a3_price_min'" in p and "budget" in p and "price_asc" in p
          assert "cg-budget-strip" in css and "cg-budget-links" in css
          assert "if ($cg_search !== '' || $cg_year > 0)" in p
          assert 'register_post_type' not in p and 'add_rewrite_rule' not in p
          assert 'wp_update_post' not in p and 'wp_insert_post' not in p
          assert 'cg-brands-grid' in css and '@media(max-width:480px)' in css
          assert 'get_header()' in p and 'get_footer()' in p
          release=Path('scripts/deploy-car-price-guide.py').read_text()
          assert 'archive-a3_car.php' in release and 'snapshot.json' in release
          assert release.index("'archive-a3_car.php'") > release.index("'car-price-guide.php'")
          print('Legacy URLs, source pricing and scoped design integration checks passed')
          PY
