name: Audit batch29 live DTC pages before drafting
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-dtc-batch29-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check the existing ten code slugs without WordPress writes
        run: python3 -u scripts/audit-dtc-batch29-preflight.py
