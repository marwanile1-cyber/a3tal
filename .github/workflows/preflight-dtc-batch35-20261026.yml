name: Preflight DTC batch35 duplicates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-dtc-batch35-20261026.yml'
      - 'scripts/preflight-dtc-batch35-20261026.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/preflight-dtc-batch35-20261026.py
