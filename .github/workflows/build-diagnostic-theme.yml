name: Build A3tal Diagnostic Theme Package

on:
  push:
    branches: [main]
    paths:
      - "theme-builds/parts/ready.txt"

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate theme package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p theme-builds
          cat theme-builds/parts/part-* > /tmp/a3tal-diagnostic-ui.zip.b64
          base64 -d /tmp/a3tal-diagnostic-ui.zip.b64 > theme-builds/a3tal-diagnostic-ui.zip
          unzip -t theme-builds/a3tal-diagnostic-ui.zip
          unzip -p theme-builds/a3tal-diagnostic-ui.zip a3tal-diagnostic-ui/style.css | grep -q "Theme Name: A3tal Diagnostic UI"

      - name: Commit package and remove temporary parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "a3tal-theme-builder"
          git config user.email "actions@users.noreply.github.com"
          git add theme-builds/a3tal-diagnostic-ui.zip
          git rm -r theme-builds/parts
          git commit -m "build: package A3tal Diagnostic UI theme"
          git push
