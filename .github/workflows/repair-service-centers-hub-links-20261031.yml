name: Update Egyptian service centers hub brand links 2026-10-31
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-service-centers-hub-links-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-service-centers-hub-link-repair-20261031
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and Bridge secret
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          python3 -m py_compile scripts/repair-service-centers-hub-links-20261031.py
      - name: Update live established service center guide and verify SEO URL and OG
        run: python3 -u scripts/repair-service-centers-hub-links-20261031.py
