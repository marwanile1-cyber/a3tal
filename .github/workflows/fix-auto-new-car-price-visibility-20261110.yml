name: Fix A3tal automatic new-car price article visibility on homepage and cars
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-auto-new-car-price-visibility-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-production-theme
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Static PHP, Python and source-contract validation
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          php -l theme-source/a3tal-global/home-reference-20261104.php
          php -l theme-source/a3tal-global/car-price-guide.php
          python3 -m py_compile scripts/deploy-dynamic-new-car-prices-listings-20261110.py
          python3 - <<'PY'
          from pathlib import Path
          home=Path('theme-source/a3tal-global/home-reference-20261104.php').read_text('utf-8')
          cars=Path('theme-source/a3tal-global/car-price-guide.php').read_text('utf-8')
          assert home.count('$home_latest_price_posts = new WP_Query')==1
          assert "'cat'=>374" in home
          assert home.count('foreach($home_latest_price_posts->posts as $price_article)')==1
          assert cars.count('id="cg-latest-price-articles"')==1
          assert cars.count('foreach(array_slice($cg_price_updates->posts,0,3)')==1
          assert cars.count("'cat'=>374,'posts_per_page'=>5")==1
          print('PRICE_ARTICLES_AUTO_HOME_AND_CARS_THEME_CONTRACT_VALID',flush=True)
          PY
      - name: Verify live theme lease and save exact two originals before any change
        run: python3 -u scripts/deploy-dynamic-new-car-prices-listings-20261110.py prepare --state-dir "$RUNNER_TEMP/prices-fix"
      - name: Encrypt and preserve theme backup
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:A3TAL_API_KEY \
            -in "$RUNNER_TEMP/prices-fix/snapshot.json" \
            -out "$RUNNER_TEMP/prices-fix/rollback.enc"
      - name: Retain encrypted rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: a3tal-dynamic-car-prices-two-template-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/prices-fix/rollback.enc
          retention-days: 7
          if-no-files-found: error
      - name: Deploy exactly two price listing PHP files with expected-hash compare and readback
        run: python3 -u scripts/deploy-dynamic-new-car-prices-listings-20261110.py deploy --state-dir "$RUNNER_TEMP/prices-fix"
      - name: Confirm latest Haval H7 price story live on homepage and cars archive
        run: python3 -u scripts/deploy-dynamic-new-car-prices-listings-20261110.py qa
