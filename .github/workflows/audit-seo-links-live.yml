name: Audit A3tal SEO and linking (read-only)
# Post-repair verification: 2026-10-18
# Crawl after DTC 234-index launch and topic/broken-link consolidation
# Verify contextual-link release and archived canonical policy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-seo-links-live.yml'
permissions:
  contents: read
jobs:
  site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Crawl sitemap URLs and build internal-link graph
        run: python -u scripts/audit-seo-links-live.py
      - name: Save complete read-only audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3tal-live-seo-link-audit-${{ github.run_id }}
          path: seo-audit-report.json
          if-no-files-found: warn
          retention-days: 14
