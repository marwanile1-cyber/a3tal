name: Egypt 1500 word quality rebuild batch 03
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-egypt-1500-batch03.yml'
      - 'scripts/backfill-egypt-1500-batch03.py'
      - 'data/expansions/egypt-1500-rebuild-batch03-20261019.json'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Static preflight
        run: |
          python3 -m py_compile scripts/editorial_minimum_words.py scripts/backfill-egypt-1500-batch03.py
          python3 -m json.tool data/expansions/egypt-1500-rebuild-batch03-20261019.json > /dev/null
      - name: Correct three existing article bodies and confirm at least 1500 words
        run: python3 -u scripts/backfill-egypt-1500-batch03.py
