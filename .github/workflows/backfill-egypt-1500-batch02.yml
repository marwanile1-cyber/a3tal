name: Rebuild 3 Egypt diagnostic guides to 1500 words minimum
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-egypt-1500-batch02.yml'
      - 'scripts/backfill-egypt-1500-batch02.py'
      - 'data/expansions/egypt-1500-rebuild-batch02-20261019.json'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Static lint
        run: |
          python3 -m py_compile scripts/editorial_minimum_words.py scripts/backfill-egypt-1500-batch02.py
          python3 -m json.tool data/expansions/egypt-1500-rebuild-batch02-20261019.json >/dev/null
      - name: Save three original pages only if each passes 1500 real words
        run: python3 -u scripts/backfill-egypt-1500-batch02.py
