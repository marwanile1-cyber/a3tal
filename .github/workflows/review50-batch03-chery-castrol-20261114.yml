name: A3tal third human50 - Chery Arrizo 8 and Castrol retail prices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review50-batch03-chery-castrol-20261114.yml'
      - 'scripts/review50-batch03-chery-castrol-20261114.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-egypt-editorial-content-write
  cancel-in-progress: false
jobs:
  update-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and Direct Bridge secret
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY" || { echo "Missing direct Bridge access"; exit 1; }
          python3 -m py_compile scripts/review50-batch03-chery-castrol-20261114.py
          python3 -m py_compile scripts/review-human-seo-geo-egypt-three-20261114.py
      - name: Protect revisions and update official price plus precise dealer comparisons
        run: python3 -u scripts/review50-batch03-chery-castrol-20261114.py
