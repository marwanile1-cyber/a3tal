name: Publish Jetour T2 i-DM 4x4 2027 Egypt exclusive launch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-jetour-t2-idm-4x4-20271103.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-jetour-t2-idm-4x4-exclusive-20271103
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install branded editorial WebP image tooling
        run: python3 -m pip install --quiet Pillow
      - name: Validate researched article, protected bridge and code
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          test -s data/editorial/jetour-t2-idm-4x4-2027-egypt-price-launch-20261103.html
          python3 -m py_compile scripts/publish-jetour-t2-idm-4x4-2027-egypt-20261103.py
      - name: Publish new variant-specific article with exclusive editorial WebP and SEO QA
        run: python3 -u scripts/publish-jetour-t2-idm-4x4-2027-egypt-20261103.py
