name: A3tal read-only 404 link contexts 2026-11-16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-a3tal-broken-link-context-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get exact source anchor and confirmed target HTTP statuses
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,re,urllib.parse
          from html.parser import HTMLParser
          sources=[
           ("https://a3tal.com/car-battery-heat-saudi-summer-voltage-test-before-replace/","car-battery-drains-when-parked-diagnosis"),
           ("https://a3tal.com/serpentine-belt-squealing-vs-timing-belt-replacement/","صيانة-دورية-للسيارة")
          ]
          candidates=[
           "https://a3tal.com/car-battery-parasitic-draw-diagnosis/",
           "https://a3tal.com/car-battery-drains-overnight-while-parked-parasitic-draw-diagnosis/",
           "https://a3tal.com/category/الصيانة-الدورية-والزيوت/",
           "https://a3tal.com/maintenance-schedules/",
           "https://a3tal.com/common-car-maintenance-mistakes-shorten-life/"
          ]
          class LinkParser(HTMLParser):
           def __init__(self):
            super().__init__();self.links=[];self.inside=None
           def handle_starttag(self,tag,attrs):
            d=dict(attrs)
            if tag=="a":
             self.inside={"href":d.get("href",""),"anchor":""}
           def handle_data(self,data):
            if self.inside is not None:self.inside["anchor"]+=data
           def handle_endtag(self,tag):
            if tag=="a" and self.inside is not None:
             self.links.append(self.inside);self.inside=None
          def read(url):
           req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; A3talLinkReadOnly/1.0)"})
           try:
            with urllib.request.urlopen(req,timeout=27) as r:
             html=r.read().decode("utf8","replace")
             p=LinkParser();p.feed(html)
             titles=re.search(r"<title[^>]*>(.*?)</title>",html,re.I|re.S)
             return {"url":url,"status":r.status,"title":re.sub(r"<[^>]+>","",titles.group(1)).strip() if titles else "","html":html,"links":p.links}
           except Exception as e:return {"url":url,"error":str(e)[:180]}
          for url,target in sources:
           r=read(url)
           found=[a for a in r.get("links",[]) if target in urllib.parse.unquote(a["href"])]
           matches=[]
           for a in found:
            i=r["html"].find(a["href"])
            matches.append({"href":a["href"],"anchor":a["anchor"][:160],"html_after":re.sub("<[^>]+>"," ",r["html"][max(0,i-350):i+500])[:800]})
           print("A3TAL_BROKEN_SOURCE_CONTEXT",json.dumps({"source":url,"status":r.get("status"),"title":r.get("title"),"matches":matches,"error":r.get("error")},ensure_ascii=False),flush=True)
          for url in candidates:
           r=read(url)
           print("A3TAL_REPLACEMENT_CANDIDATE",json.dumps({"url":url,"status":r.get("status"),"title":r.get("title"),"error":r.get("error")},ensure_ascii=False),flush=True)
          PY
