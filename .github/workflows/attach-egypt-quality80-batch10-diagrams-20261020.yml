name: Insert three original Elantra and MG6 diagnostic WebP illustrations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-egypt-quality80-batch10-diagrams-20261020.yml'
      - 'scripts/attach-egypt-quality80-batch10-diagrams-20261020.py'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  unique-editorial-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow arabic-reshaper python-bidi
      - name: Draw upload and verify topic-specific diagrams on same URLs
        run: python3 -u scripts/attach-egypt-quality80-batch10-diagrams-20261020.py
