name: Publish Renault Boreal 2027 price and trims in Egypt
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-renault-boreal-2027-egypt-20261102.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-renault-boreal-2027-egypt-launch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install image processor for authentic Renault media photography
        run: python3 -m pip install --quiet Pillow
      - name: Check bridge credential and editorial content
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          python3 -m py_compile scripts/publish-renault-boreal-2027-egypt-20261102.py
          test -s data/editorial/renault-boreal-2027-price-egypt-20261102.html
      - name: Publish verified review and unique editorial WebP treatments via A3tal Direct Bridge
        run: python3 -u scripts/publish-renault-boreal-2027-egypt-20261102.py
