name: Attach three original Octavia Corolla MG6 repair diagrams on live posts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-egypt-quality80-batch12-diagrams-20261020.yml'
      - 'scripts/attach-egypt-quality80-batch12-diagrams-20261020.py'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  explanatory-media:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow arabic-reshaper python-bidi
      - name: Attach and verify three different 1600x900 Arabic WebP diagrams
        run: python3 -u scripts/attach-egypt-quality80-batch12-diagrams-20261020.py
