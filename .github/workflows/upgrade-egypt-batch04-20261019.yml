name: Egypt model encyclopedic depth repairs batch 04
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-egypt-batch04-20261019.yml','scripts/upgrade-egypt-batch04-20261019.py','data/expansions/egypt-editorial-batch04-20261019.json']
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/upgrade-egypt-batch04-20261019.py
      - run: python3 -m json.tool data/expansions/egypt-editorial-batch04-20261019.json >/dev/null
      - name: Update exact five existing pages and check visible HTML
        run: python3 -u scripts/upgrade-egypt-batch04-20261019.py
