name: Publish 17 verified REAL PSEO engine architectures and cargo variants batch16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-car-reference-batch16-seventeen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: [bd-engine-architectures, sp-engine-architectures, nq-engine-architectures, cn-engine-architectures]
    concurrency:
      group: a3tal-real-pseo-b16-${{ matrix.family }}
      cancel-in-progress: false
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3CR_FAMILY: ${{ matrix.family }}
      A3CR_LIMIT: '6'
    steps:
      - uses: actions/checkout@v4
      - name: Validate manufacturer sourced 17 independent facts and release script
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          python3 -m py_compile scripts/publish-car-reference-batch12-18-pages.py scripts/publish-car-reference-batch16-engine-cargo.py
          python3 - <<'PY'
          import json
          d=json.load(open('data/car-reference/batch-16-engine-architectures-and-cargo-20261107.json'))
          rows=[s for g in d['clusters'] for s in g['specs']]
          assert len(d['clusters'])==4 and len(rows)==17 and len({x['slug'] for x in rows})==17
          assert all(len(r['facts'])>=9 and len(r['intro'])>160 and len(r['detail'])>230 and len(r['warning'])>130 for r in rows)
          assert all(r['sources'] and all(s.startswith(('https://ownersmanual.kia.com/','https://ownersmanual.hyundai.com/')) for s in r['sources']) for r in rows)
          print('SEVENTEEN_ENGINE_AND_CARGO_INTENTS_VERIFIED')
          PY
      - name: Install photo tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python3 -m pip install --quiet pillow requests
      - name: Verify independent dedicated PSEO engine
        run: |
          curl -fsSL --retry 3 https://a3tal.com/wp-json/a3tal-car-reference/v1/health | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") and x.get("published",0)>=163'
      - name: Publish specific engine and boot articles with original slugs image canonical and OG QA
        run: python3 -u scripts/publish-car-reference-batch16-engine-cargo.py
      - name: Retain exact links and SEO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pseo-b16-${{ matrix.family }}-${{ github.run_id }}
          path: car-reference-batch16-${{ matrix.family }}-audit.json
          if-no-files-found: warn
          retention-days: 30
