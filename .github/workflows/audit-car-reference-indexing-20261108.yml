name: Audit full car-reference XML sitemap and export indexing URL manifest
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-car-reference-indexing-20261108.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install requests and validate indexing-manifest script
        run: |
          python3 -m pip install -q requests
          python3 -m py_compile scripts/audit-car-reference-indexing-manifest-20261108.py
      - name: Verify live sitemap, Google-discoverable index, all published URLs and representative canonicals
        run: python3 -u scripts/audit-car-reference-indexing-manifest-20261108.py
      - name: Save up-to-date actual sitemap URL manifest back in GitHub
        continue-on-error: true
        run: |
          git config user.name "a3tal-indexing-audit[bot]"
          git config user.email "a3tal-indexing-audit[bot]@users.noreply.github.com"
          git add data/car-reference/a3tal-car-reference-indexing-manifest-live.csv data/car-reference/a3tal-car-reference-indexing-audit-live.json
          if ! git diff --cached --quiet; then
            git commit -m "seo: export actual live car-reference sitemap URLs and crawl audit"
            git push origin HEAD:main
          fi
      - name: Download CSV and JSON audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3tal-car-reference-indexing-urls-${{ github.run_id }}
          path: |
            data/car-reference/a3tal-car-reference-indexing-manifest-live.csv
            data/car-reference/a3tal-car-reference-indexing-audit-live.json
          if-no-files-found: warn
          retention-days: 90
