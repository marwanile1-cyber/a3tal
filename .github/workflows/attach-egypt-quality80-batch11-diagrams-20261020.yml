name: Publish two unique Elantra safety and Octavia suspension editorial diagrams
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-egypt-quality80-batch11-diagrams-20261020.yml'
      - 'scripts/attach-egypt-quality80-batch11-diagrams-20261020.py'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  unique-illustrations:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow arabic-reshaper python-bidi
      - name: Draw upload and verify two unique original WordPress article images
        run: python3 -u scripts/attach-egypt-quality80-batch11-diagrams-20261020.py
