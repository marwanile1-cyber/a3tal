name: A3tal legacy internal links audit 20261121
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a3tal-legacy-internal-links-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read published WordPress articles and locate links to verified redirects
        shell: bash
        run: |
          cat > /tmp/links_audit.py <<'PY'
          import json,urllib.request,urllib.parse,html,sys,time
          root="https://a3tal.com/wp-json/wp/v2"
          sources=[
          "دليلك-الشامل-أفضل-مراكز-خدمة-غبور-أوتو",
          "مركز-خدمة-منصور-شيفروليه-الرئيسي-في-ال",
          "mansour-chevrolet-maintenance-booking-numbers-branches",
          "jetour-t2-maintenance-schedule-spare-parts",
          "haval-v7-2027-price-specs-egypt",
          "radiator-internal-blockage-flow-temperature-test-2",
          "الدليل-الشامل-أرقام-مراكز-خدمإ-المنصو",
          "الدليل-الشامل-أرقام-مراكز-خدمإ-المنصور",
          "الدليل-الدليل-الشامل-أرقام-مراكز-خدمة-المنصور",
          "مراكز-خدمة-جيتور-ايمعتمدة-في-مصر",
          "مراكز-خدمة-جيتوش-المعتمدة-في-مصر",
          "دليلك-الشامل-أفضل-مراكز-خدمإ-غبور-أوتو",
          "صيانة-سيارام-سيارات-في-حدائق-االأهرام-دليلك-ال"
          ]
          matches=[];counts={s:0 for s in sources};totals={}
          for kind in ("posts","pages"):
            page=1;seen=0
            while page<=12:
              url=f"{root}/{kind}?per_page=100&page={page}&_fields=id,slug,link,content.rendered"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (A3tal Internal Link Audit)"})
              try:
                with urllib.request.urlopen(req,timeout=35) as resp: rows=json.load(resp)
              except Exception as e:
                if page==1:raise SystemExit(f"Cannot audit {kind}: {e}")
                break
              if not isinstance(rows,list) or not rows:break
              seen+=len(rows)
              for post in rows:
                content=post.get("content",{}).get("rendered","")
                decoded=html.unescape(urllib.parse.unquote(content)).lower()
                found=[s for s in sources if "/"+s.lower()+"/" in decoded]
                if found:
                  matches.append({"id":post["id"],"link":post.get("link"),"old_targets":found})
                  for s in found:counts[s]+=1
              if len(rows)<100:break
              page+=1
            totals[kind]=seen
          result={"scanned":totals,"matching_posts":len(matches),"links_by_source":counts,"pages":matches}
          with open("a3tal-internal-legacy-links-20261121.json","w",encoding="utf-8") as f:json.dump(result,f,ensure_ascii=False,indent=2)
          print("LEGACY_LINKS_SUMMARY",json.dumps({"scanned":totals,"matching_posts":len(matches),"counts":counts},ensure_ascii=False),flush=True)
          print("LEGACY_LINKS_MATCHES",json.dumps(matches[:100],ensure_ascii=False),flush=True)
          PY
          python3 /tmp/links_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3tal-internal-legacy-links-20261121
          path: a3tal-internal-legacy-links-20261121.json
          if-no-files-found: ignore
          retention-days: 30
