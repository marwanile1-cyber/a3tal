name: Update reviewed BMW i3 Neue Klasse article with September official facts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-egypt-bmw-neue-klasse-official-2026-batch04.yml'
      - 'scripts/backfill-egypt-quality80-reviewed-batch04-bmw.py'
      - 'data/expansions/egypt-editorial-quality80-batch04-bmw-20261020.json'
      - 'data/quality-audits/egypt-editorial-manual-audit-20261020-04-bmw.json'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  bmw-editorial-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manually approved BMW 2026 materials
        run: |
          python3 -m py_compile scripts/editorial_minimum_words.py scripts/backfill-egypt-quality80-reviewed-batch04-bmw.py
          python3 -m json.tool data/expansions/egypt-editorial-quality80-batch04-bmw-20261020.json >/dev/null
          python3 -m json.tool data/quality-audits/egypt-editorial-manual-audit-20261020-04-bmw.json >/dev/null
      - name: Publish original news-to-encyclopedia correction and verify 1500 words plus official sources
        run: python3 -u scripts/backfill-egypt-quality80-reviewed-batch04-bmw.py
