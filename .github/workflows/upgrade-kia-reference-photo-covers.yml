name: Refresh Old Kia Car Reference Covers With Photo Design
on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-batch01-kia-photographic-covers.py'
      - '.github/workflows/upgrade-kia-reference-photo-covers.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-production-car-reference-photo-upgrade
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3CR_IMAGE_LIMIT: '25'
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe photo content and data
        shell: bash
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          python3 -m py_compile scripts/publish-car-reference-batch02-premium.py scripts/upgrade-batch01-kia-photographic-covers.py
          python3 - <<'PY'
          import json
          d=json.load(open('data/car-reference/batch-01-kia-verified-2026-11-02.json'))
          assert len(d['specs'])==26
          assert len({x['slug'] for x in d['specs']})==26
          assert len([r for r in d['specs'] if (r['model'],r['slug'])!=('cerato-bd-2023','engine-oil-16-mpi')])==25
          print('Source audit passed: exactly 25 original non-approved covers')
          PY
      - name: Prepare original ChatGPT photo assets and typography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core
          python3 -m pip install --quiet --disable-pip-version-check requests pillow
      - name: Upgrade images and verify current OG and original links
        run: python3 scripts/upgrade-batch01-kia-photographic-covers.py
      - name: Attach full post-by-post audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kia-25-photo-upgrades-${{ github.run_id }}
          path: car-reference-batch01-photo-upgrade-report.json
          if-no-files-found: warn
          retention-days: 30
