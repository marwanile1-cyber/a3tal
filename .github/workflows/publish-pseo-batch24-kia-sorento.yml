name: Publish Kia Sorento HEV Egypt - seven researched technical pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pseo-batch24-kia-sorento.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-pseo-b24-kia-sorento
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3CR_FAMILY: kia-sorento-topline
      A3CR_LIMIT: '8'
    steps:
      - uses: actions/checkout@v4
      - name: Editorial QA - independent buyer and owner intent, no invented specifications
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          python3 -m py_compile scripts/publish-car-reference-batch24-kia-sorento-quality.py
          python3 - <<'PY'
          import json, re, html
          d=json.load(open("data/car-reference/batch-24-kia-sorento-hybrid-quality-20261107.json",encoding="utf8"))
          assert len(d["clusters"])==1
          g=d["clusters"][0]
          assert g["brand"]=="kia" and len(g["specs"])==6
          pages=[g["model"]]+g["specs"]
          assert len({x["slug"] for x in pages})==7
          assert len({x["rich_html"] for x in pages})==7
          assert len({x["category"] for x in g["specs"]})==6
          assert len(g["photos"])>=12 and len(set(g["photos"]))==len(g["photos"])
          assert all(u.startswith("https://www.kia.com.eg/uploads/") for u in g["photos"])
          for row in pages:
              words=html.unescape(re.sub(r"<[^>]*>"," ",row["rich_html"])).split()
              assert len(words)>=400,(row["slug"],len(words))
              assert row["rich_html"].count("<h2>")>=4
              assert row["rich_html"].count("<table>")==1
              assert row["rich_html"].count("<a href=")>=7
              assert "kia.com.eg" in row["rich_html"]
              assert "a3tal.com/car-reference/kia/" in row["rich_html"]
              assert 75<=len(row["meta_description"])<=155
          assert all(len(x["facts"])>=10 for x in g["specs"])
          assert "67" in g["model"]["rich_html"] and "76" in g["model"]["rich_html"]
          assert "67" in g["specs"][1]["rich_html"] and "76" in g["specs"][1]["rich_html"]
          assert all("high voltage" not in str(x["rich_html"]).lower() for x in pages)
          print("SEVEN_KIA_SORENTO_TECHNICAL_INTENTS_AND_SOURCE_CONFLICT_QA_OK")
          PY
      - name: Install photographic WebP and bridge dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python3 -m pip install --quiet pillow requests
      - name: Check published site PSEO system
        run: |
          curl -fsSL --retry 3 https://a3tal.com/wp-json/a3tal-car-reference/v1/health | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x.get("ok") and x.get("version")=="1.0.0" and x.get("published",0)>=292'
      - name: Publish Kia Sorento model hub and six distinct specs with visible WebP and canonical checks
        run: python3 -u scripts/publish-car-reference-batch24-kia-sorento-quality.py
      - name: Save full independent publication audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3tal-kia-sorento-b24-${{ github.run_id }}
          path: car-reference-batch24-kia-sorento-topline-audit.json
          if-no-files-found: warn
          retention-days: 30
