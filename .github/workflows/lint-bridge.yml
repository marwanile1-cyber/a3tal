name: Lint A3tal Direct Bridge

on:
  push:
    paths:
      - 'a3tal-direct-bridge.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: php -l a3tal-direct-bridge.php
