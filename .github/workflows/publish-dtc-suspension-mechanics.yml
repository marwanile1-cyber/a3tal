name: Publish DTC Suspension Mechanics Batch

on:
  push:
    paths:
      - '.github/workflows/publish-dtc-suspension-mechanics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      BASE: https://a3tal.com/wp-json/a3tal-direct/v1
      SITE: https://a3tal.com
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet pillow requests beautifulsoup4

      - name: Publish six complete articles
        shell: bash
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          cat > /tmp/publish_batch.py <<'PY'
          import os, re, io, json, math, base64, time
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          SITE=os.environ["SITE"].rstrip("/")
          BASE=os.environ["BASE"].rstrip("/")
          KEY=os.environ["A3TAL_API_KEY"]
          DATA="tmp/a3tal-batch-dtc-suspension-mechanics-20261005.json"
          HEAD={"X-A3tal-Key":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"}
          UA={"User-Agent":"A3talEditorialBot/2026"}
          OUT="/tmp/a3tal_diag_imgs"
          os.makedirs(OUT,exist_ok=True)

          with open(DATA,"r",encoding="utf-8") as f:
              batch=json.load(f)
          articles=batch["articles"]

          def words(html):
              text=BeautifulSoup(html,"html.parser").get_text(" ",strip=True)
              return len(re.findall(r"\S+",text))

          def hexrgb(h):
              h=h.lstrip("#")
              return tuple(int(h[i:i+2],16) for i in (0,2,4))

          def font(size,bold=False):
              paths=[
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf"
              ]
              for p in paths:
                  if os.path.exists(p):
                      return ImageFont.truetype(p,size)
              return ImageFont.load_default()

          def base_canvas(accent,w=1600,h=900,variant="featured"):
              a=hexrgb(accent)
              im=Image.new("RGB",(w,h),(10,15,22))
              px=im.load()
              for y in range(h):
                  t=y/(h-1)
                  c=(
                    int(9*(1-t)+27*t),
                    int(15*(1-t)+34*t),
                    int(23*(1-t)+42*t)
                  )
                  for x in range(w):
                      px[x,y]=c
              glow=Image.new("RGBA",(w,h),(0,0,0,0))
              gd=ImageDraw.Draw(glow,"RGBA")
              gd.ellipse((w*0.48,h*0.02,w*1.08,h*0.72),fill=(*a,70 if variant=="featured" else 45))
              gd.ellipse((-w*0.16,h*0.30,w*0.45,h*1.05),fill=(255,255,255,18))
              glow=glow.filter(ImageFilter.GaussianBlur(95))
              im=Image.alpha_composite(im.convert("RGBA"),glow)
              d=ImageDraw.Draw(im,"RGBA")
              for yy in range(int(h*0.68),h,46):
                  d.line((0,yy,w,yy),fill=(255,255,255,10),width=1)
              for xx in range(-300,w+400,160):
                  d.line((w//2,int(h*0.68),xx,h),fill=(255,255,255,8),width=1)
              d.rounded_rectangle((45,45,w-45,h-45),28,outline=(255,255,255,24),width=2)
              return im

          def watermark(im):
              d=ImageDraw.Draw(im,"RGBA")
              f=font(31,True)
              text="A3TAL"
              box=d.textbbox((0,0),text,font=f)
              x=im.width-box[2]-58; y=im.height-box[3]-47
              d.rounded_rectangle((x-18,y-12,im.width-34,im.height-24),16,fill=(0,0,0,95))
              d.text((x,y),text,font=f,fill=(245,247,250,240))
              d.rectangle((x-7,y+box[3]-7,x+4,y+box[3]+4),fill=(235,45,62,245))

          def meter(d,cx,cy,r,accent):
              d.ellipse((cx-r,cy-r,cx+r,cy+r),fill=(230,236,242,235),outline=(80,90,102,255),width=8)
              d.ellipse((cx-r+25,cy-r+25,cx+r-25,cy+r-25),fill=(27,34,43,255))
              for i in range(9):
                  ang=math.radians(210+i*15)
                  x1=cx+math.cos(ang)*(r-48); y1=cy+math.sin(ang)*(r-48)
                  x2=cx+math.cos(ang)*(r-30); y2=cy+math.sin(ang)*(r-30)
                  d.line((x1,y1,x2,y2),fill=(220,225,230,220),width=4)
              ang=math.radians(300)
              d.line((cx,cy,cx+math.cos(ang)*(r-55),cy+math.sin(ang)*(r-55)),fill=accent+(255,),width=10)
              d.ellipse((cx-15,cy-15,cx+15,cy+15),fill=accent+(255,))

          def draw_voltage(im,accent,variant):
              d=ImageDraw.Draw(im,"RGBA"); a=hexrgb(accent)
              x0,y0=225,300
              d.rounded_rectangle((x0,y0,x0+430,y0+300),34,fill=(37,45,55,255),outline=(210,218,225,130),width=4)
              d.rounded_rectangle((x0+65,y0-38,x0+145,y0+15),10,fill=(175,184,194,255))
              d.rounded_rectangle((x0+285,y0-38,x0+365,y0+15),10,fill=(175,184,194,255))
              d.rectangle((x0+90,y0+95,x0+340,y0+208),fill=(18,24,31,255))
              d.line((x0+155,y0+151,x0+215,y0+151),fill=(240,245,250,255),width=14)
              d.line((x0+300,y0+121,x0+300,y0+181),fill=(240,245,250,255),width=14)
              d.line((x0+270,y0+151,x0+330,y0+151),fill=(240,245,250,255),width=14)
              meter(d,1075,415,205,a)
              # alternator stylized
              d.ellipse((720,535,1000,815),fill=(92,101,112,255),outline=(210,218,225,190),width=8)
              d.ellipse((790,605,930,745),fill=(24,30,38,255),outline=(*a,230),width=8)
              for ang in range(0,360,45):
                  rr=95; cx=860+math.cos(math.radians(ang))*rr; cy=675+math.sin(math.radians(ang))*rr
                  d.ellipse((cx-16,cy-16,cx+16,cy+16),fill=(42,50,60,255))
              d.line((650,470,870,560),fill=(*a,210),width=9)
              d.line((965,550,1040,515),fill=(*a,210),width=9)

          def draw_oxygen(im,accent,variant):
              d=ImageDraw.Draw(im,"RGBA"); a=hexrgb(accent)
              # exhaust pipe
              d.rounded_rectangle((180,475,1400,645),80,fill=(90,99,110,255),outline=(215,221,227,150),width=7)
              d.rounded_rectangle((230,510,1350,610),48,fill=(34,40,48,255))
              # sensor body
              d.polygon([(740,190),(910,230),(880,495),(710,455)],fill=(190,199,207,255),outline=(250,250,250,170))
              d.rectangle((722,365,885,430),fill=(113,122,132,255))
              for y in range(375,425,12): d.line((725,y,883,y),fill=(220,225,230,150),width=3)
              d.polygon([(735,454),(875,486),(845,575),(705,542)],fill=(160,168,177,255))
              # wire
              pts=[(825,210),(930,120),(1120,120),(1230,205)]
              d.line(pts,fill=(*a,235),width=16)
              d.rounded_rectangle((1200,165,1370,250),18,fill=(35,44,54,255),outline=(220,225,230,100),width=4)
              # heater glow
              glow=Image.new("RGBA",im.size,(0,0,0,0)); gd=ImageDraw.Draw(glow,"RGBA")
              gd.ellipse((655,395,930,630),fill=(*a,65))
              glow=glow.filter(ImageFilter.GaussianBlur(45)); im.alpha_composite(glow)
              # circuit boxes
              d=ImageDraw.Draw(im,"RGBA")
              for xx in (250,1120):
                  d.rounded_rectangle((xx,190,xx+210,330),24,fill=(18,25,34,220),outline=(*a,120),width=3)
                  d.line((xx+45,260,xx+165,260),fill=(230,236,242,200),width=7)
                  d.ellipse((xx+92,230,xx+122,260),fill=(*a,230))

          def draw_balljoint(im,accent,variant):
              d=ImageDraw.Draw(im,"RGBA"); a=hexrgb(accent)
              # control arm
              d.polygon([(190,690),(650,410),(920,690),(780,785),(590,610),(330,790)],fill=(68,77,88,255),outline=(210,218,225,140))
              d.ellipse((250,650,390,790),fill=(20,27,35,255),outline=(180,190,200,180),width=8)
              d.ellipse((700,650,850,800),fill=(20,27,35,255),outline=(180,190,200,180),width=8)
              # ball joint cutaway
              cx,cy=1005,470
              d.ellipse((cx-180,cy-180,cx+180,cy+180),fill=(105,115,126,255),outline=(232,237,241,180),width=10)
              d.ellipse((cx-110,cy-110,cx+110,cy+110),fill=(*a,175),outline=(250,250,250,210),width=8)
              d.ellipse((cx-56,cy-56,cx+56,cy+56),fill=(225,230,235,255))
              d.rounded_rectangle((cx-35,cy-300,cx+35,cy-60),28,fill=(195,202,210,255))
              d.polygon([(cx-95,cy-165),(cx+95,cy-165),(cx+125,cy-105),(cx-125,cy-105)],fill=(30,37,46,255))
              # knuckle
              d.rounded_rectangle((1190,250,1370,700),55,fill=(52,61,72,230),outline=(180,190,200,100),width=5)
              d.line((1130,460,1200,460),fill=(*a,230),width=18)

          def draw_shock(im,accent,variant):
              d=ImageDraw.Draw(im,"RGBA"); a=hexrgb(accent)
              cx=800
              d.rounded_rectangle((cx-70,160,cx+70,760),50,fill=(80,90,102,255),outline=(225,230,235,180),width=7)
              d.rectangle((cx-28,100,cx+28,250),fill=(205,211,217,255))
              d.ellipse((cx-135,720,cx+135,835),fill=(44,52,62,255),outline=(200,207,214,160),width=6)
              # coil
              pts=[]
              for i in range(120):
                  t=i/119
                  y=220+t*440
                  x=cx+170*math.sin(t*math.pi*9)
                  pts.append((x,y))
              d.line(pts,fill=(*a,235),width=25,joint="curve")
              # oil drop
              d.ellipse((1030,520,1090,590),fill=(235,190,55,230))
              d.polygon([(1060,470),(1028,535),(1092,535)],fill=(235,190,55,230))
              # wheel silhouette
              d.ellipse((180,300,580,700),fill=(20,25,32,255),outline=(165,175,186,120),width=16)
              d.ellipse((290,410,470,590),fill=(72,82,92,255))
              d.line((560,500,680,560),fill=(180,188,198,180),width=18)

          def draw_compression(im,accent,variant):
              d=ImageDraw.Draw(im,"RGBA"); a=hexrgb(accent)
              # engine block with cylinders
              d.rounded_rectangle((190,300,900,760),55,fill=(62,72,84,255),outline=(210,216,224,160),width=8)
              for i in range(4):
                  x=260+i*155
                  d.ellipse((x,380,x+115,650),fill=(23,30,38,255),outline=(150,160,171,160),width=6)
                  d.rectangle((x+20,520,x+95,650),fill=(*a,85))
                  d.ellipse((x+20,490,x+95,565),fill=(*a,200))
              # hose to gauge
              d.line((820,340,1040,220,1190,250),fill=(210,216,222,255),width=18)
              meter(d,1230,350,205,a)
              # leakdown arrows
              if variant=="inline":
                  for ang in (20,90,160,230,300):
                      x1=640+math.cos(math.radians(ang))*120; y1=710+math.sin(math.radians(ang))*70
                      x2=640+math.cos(math.radians(ang))*220; y2=710+math.sin(math.radians(ang))*130
                      d.line((x1,y1,x2,y2),fill=(*a,170),width=8)

          def draw_sparkplug(im,accent,variant):
              d=ImageDraw.Draw(im,"RGBA"); a=hexrgb(accent)
              # large spark plug
              d.rounded_rectangle((650,150,830,520),55,fill=(235,238,241,255),outline=(150,160,170,180),width=7)
              for y in range(300,500,25): d.line((640,y,845,y),fill=(118,128,139,190),width=7)
              d.polygon([(680,520),(800,520),(770,720),(710,720)],fill=(175,184,193,255))
              d.line((720,720,720,790),fill=(220,225,230,255),width=20)
              d.line((790,720,790,775),fill=(220,225,230,255),width=18)
              d.arc((705,750,805,820),190,350,fill=(*a,255),width=12)
              # injector
              d.polygon([(250,230),(450,260),(430,520),(275,500)],fill=(70,80,92,255),outline=(210,215,220,140))
              d.rectangle((300,500,405,590),fill=(160,170,180,255))
              for i in range(7):
                  x=315+i*13
                  d.line((x,590,x-70+(i*22),735),fill=(*a,130),width=5)
              # fuel droplets
              for x,y,r in [(930,500,26),(1010,580,19),(1100,470,15),(1190,610,24)]:
                  d.ellipse((x-r,y-r,x+r,y+r),fill=(*a,210))
                  d.polygon([(x,y-r*2),(x-r,y),(x+r,y)],fill=(*a,210))
              # coil/spark
              d.rounded_rectangle((1080,200,1330,360),28,fill=(34,42,52,255),outline=(190,199,208,120),width=4)
              d.line((1090,330,900,410,820,675),fill=(220,225,230,170),width=12)
              bolt=[(820,675),(855,640),(840,700),(885,675),(845,735)]
              d.line(bolt,fill=(245,250,255,255),width=8)

          DRAW={
              "voltage":draw_voltage,
              "oxygen":draw_oxygen,
              "balljoint":draw_balljoint,
              "shock":draw_shock,
              "compression":draw_compression,
              "sparkplug":draw_sparkplug,
          }

          def make_image(article,variant):
              im=base_canvas(article["accent"],variant=variant)
              DRAW[article["image_kind"]](im,article["accent"],variant)
              watermark(im)
              path=os.path.join(OUT,article["slug"]+"-"+variant+".webp")
              im.convert("RGB").save(path,"WEBP",quality=82,method=6)
              return path

          def b64(path):
              with open(path,"rb") as f:
                  return base64.b64encode(f.read()).decode("ascii")

          def post_json(path,payload,timeout=120):
              r=requests.post(BASE+path,headers=HEAD,json=payload,timeout=timeout)
              if r.status_code<200 or r.status_code>=300:
                  raise RuntimeError(f"{path} HTTP {r.status_code}: {r.text[:1000]}")
              return r.json()

          # content quality + duplication guard
          for a in articles:
              wc=words(a["content"])
              print("WORDCOUNT",a["slug"],wc)
              if wc < 1000:
                  raise RuntimeError(f"Article below 1000 words: {a['slug']}={wc}")
              q=requests.get(SITE+"/wp-json/wp/v2/posts",params={"slug":a["slug"],"_fields":"id,link,title"},headers=UA,timeout=30)
              q.raise_for_status()
              if q.json():
                  raise RuntimeError("Slug already exists: "+a["slug"])

          results=[]
          for idx,a in enumerate(articles,1):
              print(f"PUBLISH {idx}/{len(articles)} {a['slug']}")
              fp=make_image(a,"featured")
              ip=make_image(a,"inline")
              canonical=SITE+"/"+a["slug"]+"/"
              meta={
                "_yoast_wpseo_focuskw":a["focus"],
                "_yoast_wpseo_title":a["seo_title"]+" | أعطال.كوم",
                "_yoast_wpseo_metadesc":a["meta_desc"],
                "_yoast_wpseo_canonical":canonical,
                "_yoast_wpseo_opengraph-title":a["seo_title"]+" | أعطال.كوم",
                "_yoast_wpseo_opengraph-description":a["meta_desc"],
                "_yoast_wpseo_twitter-title":a["seo_title"]+" | أعطال.كوم",
                "_yoast_wpseo_twitter-description":a["meta_desc"],
              }
              payload={
                "post":{
                  "title":a["title"],
                  "slug":a["slug"],
                  "content":a["content"],
                  "excerpt":a["excerpt"],
                  "status":"publish",
                  "categories":a["categories"],
                  "tags":a["tags"],
                  "meta":meta
                },
                "media":[
                  {
                    "key":"featured","role":"featured","set_featured":True,
                    "image_base64":b64(fp),"filename":a["slug"]+"-featured.webp",
                    "title":a["featured_alt"],"alt":a["featured_alt"],"convert_webp":False
                  },
                  {
                    "key":"inline","role":"inline","placeholder":"{{a3tal_image:inline}}",
                    "image_base64":b64(ip),"filename":a["slug"]+"-diagnostic.webp",
                    "title":a["inline_alt"],"alt":a["inline_alt"],"convert_webp":False
                  }
                ]
              }
              res=post_json("/publish-bundle",payload,180)
              post=res["post"]; media=res["media"]
              pid=int(post["id"]); featured=media["featured"]; inline=media["inline"]
              # lock Yoast social image to the actual new featured image
              post_json("/admin",{
                "op":"post_meta_set","post_id":pid,
                "meta":{
                  "_yoast_wpseo_opengraph-image":featured["url"],
                  "_yoast_wpseo_opengraph-image-id":str(featured["media_id"]),
                  "_yoast_wpseo_twitter-image":featured["url"],
                  "_yoast_wpseo_twitter-image-id":str(featured["media_id"])
                }
              })
              post_json("/update-post",{"id":pid,"status":"publish"})
              results.append({
                "id":pid,"slug":a["slug"],"url":canonical,
                "featured_url":featured["url"],"featured_id":featured["media_id"],
                "inline_url":inline["url"],"categories":a["categories"],
                "word_count":words(a["content"])
              })

          post_json("/admin",{"op":"cache_flush"})
          time.sleep(2)

          # live verification
          for r in results:
              api=requests.get(SITE+"/wp-json/wp/v2/posts/"+str(r["id"]),params={"_fields":"id,link,status,slug,featured_media,categories,content,title"},headers=UA,timeout=40)
              api.raise_for_status(); j=api.json()
              if j.get("status")!="publish": raise RuntimeError("Not published "+r["url"])
              if int(j.get("featured_media") or 0)!=int(r["featured_id"]): raise RuntimeError("Featured mismatch "+r["url"])
              if not set(r["categories"]).issubset(set(j.get("categories",[]))): raise RuntimeError("Category mismatch "+r["url"])
              rendered=j.get("content",{}).get("rendered","")
              if r["inline_url"] not in rendered: raise RuntimeError("Inline image missing "+r["url"])
              if words(rendered)<1000: raise RuntimeError("Live content under 1000 words "+r["url"])

              html=requests.get(r["url"],headers=UA,timeout=40).text
              soup=BeautifulSoup(html,"html.parser")
              can=soup.find("link",rel="canonical")
              if not can or can.get("href","").rstrip("/")!=r["url"].rstrip("/"):
                  raise RuntimeError("Canonical mismatch "+r["url"])
              robots=soup.find("meta",attrs={"name":"robots"})
              rob=(robots.get("content","") if robots else "").lower()
              if "index" not in rob or "max-image-preview:large" not in rob:
                  raise RuntimeError("Robots/max-image-preview bad "+r["url"])
              og=soup.find("meta",attrs={"property":"og:image"})
              if not og or r["featured_url"] not in og.get("content",""):
                  raise RuntimeError("OG image mismatch "+r["url"]+" got="+str(og))
              h1s=soup.find_all("h1")
              if len(h1s)!=1:
                  raise RuntimeError("H1 count "+str(len(h1s))+" "+r["url"])
              print("VERIFIED",r["url"],"words",r["word_count"],"featured",r["featured_url"])

          # sitemap should contain all new URLs
          sm=requests.get(SITE+"/post-sitemap.xml",headers=UA,timeout=60).text
          missing=[r["url"] for r in results if r["url"] not in sm]
          if missing:
              time.sleep(5)
              sm=requests.get(SITE+"/post-sitemap.xml?cb="+str(int(time.time())),headers=UA,timeout=60).text
              missing=[r["url"] for r in results if r["url"] not in sm]
          if missing:
              raise RuntimeError("Missing from post sitemap: "+", ".join(missing))

          with open("/tmp/published-links.json","w",encoding="utf-8") as f:
              json.dump(results,f,ensure_ascii=False,indent=2)
          print("FINAL_LINKS")
          for r in results: print(r["url"])
          PY
          python /tmp/publish_batch.py

      - name: Show final links
        if: success()
        run: cat /tmp/published-links.json
