name: Publish MG5 Egypt Official Technical Reference
on:
  push:
    branches: [main]
    paths:
      - 'data/car-reference/batch-09-mg5-egypt-official-20261103.json'
      - 'scripts/publish-car-reference-batch09-mg5.py'
      - '.github/workflows/publish-car-reference-batch09-mg5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-reference-mg5-egypt
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3CR_LIMIT: '6'
    steps:
      - uses: actions/checkout@v4
      - name: Validate original MG Egypt data and non-duplicate search intents
        shell: bash
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          python3 -m py_compile scripts/publish-car-reference-batch09-mg5.py
          python3 - <<'PY'
          import json
          data=json.load(open('data/car-reference/batch-09-mg5-egypt-official-20261103.json'))
          assert data['brand']['slug']=='mg' and data['model']['slug']=='mg5-egypt'
          assert len(data['items'])==4
          assert len({x['slug'] for x in data['items']})==4
          assert all(len(x['facts'])>=5 for x in data['items'])
          assert all(len(x['intro'])>=100 and len(x['detail'])>=100 and len(x['warning'])>=80 for x in data['items'])
          assert all(x['sources'] and all(u.startswith('https://www.mgmotor.com.eg/') for u in x['sources']) for x in data['items'])
          assert len(data['nonduplication']['existing'])>=3
          assert data['photos']['primary'].startswith('https://a3tal.com/')
          print('MG5 Egypt verified photo, manufacturer source and intent gates passed')
          PY
      - name: Install photo and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core
          python3 -m pip install --quiet --disable-pip-version-check pillow requests
      - name: Confirm installed WordPress reference engine
        run: |
          curl -fLsS --retry 3 "https://a3tal.com/wp-json/a3tal-car-reference/v1/health" -o /tmp/status.json
          jq -e '.ok == true and .version == "1.0.0"' /tmp/status.json >/dev/null
      - name: Publish and verify photo, Yoast OG, canonical and live URL
        run: python3 scripts/publish-car-reference-batch09-mg5.py
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-reference-mg5-batch09-${{ github.run_id }}
          path: car-reference-batch09-mg5-results.json
          if-no-files-found: warn
          retention-days: 30
