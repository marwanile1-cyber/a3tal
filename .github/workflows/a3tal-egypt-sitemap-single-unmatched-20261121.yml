name: A3tal Egypt - verify sitemap REST coverage after four 301s
on:
  push:
    branches: [main]
    paths: ['.github/workflows/a3tal-egypt-sitemap-single-unmatched-20261121.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Identify exact unmatched Egypt page and inspect indexability without changes
        run: |
          python3 -m pip install -q requests beautifulsoup4
          python3 - <<'PY'
          import requests,xml.etree.ElementTree as ET,urllib.parse,json,re
          from bs4 import BeautifulSoup
          B='https://a3tal.com';s=requests.Session();s.headers.update({'User-Agent':'A3tal-Egypt-ReadOnly-Post-Sitemap-REST-Coverage/1.0'})
          def norm(u):return urllib.parse.unquote(urllib.parse.urlsplit(u).path).rstrip('/')+'/'
          def fetch(u):r=s.get(u,timeout=40);r.raise_for_status();return r
          tree=ET.fromstring(fetch(B+'/post-sitemap.xml').content)
          entries=[e.text for u in tree for e in u if e.tag.split('}')[-1]=='loc' and e.text]
          active={norm(u):u for u in entries}
          seen={};errors=[]
          for page in range(1,14):
            u=B+'/wp-json/wp/v2/posts?per_page=100&page='+str(page)+'&_fields=id,link,status'
            try:
              arr=fetch(u).json()
              if not isinstance(arr,list):break
              for row in arr:seen[norm(row['link'])]=row
              if len(arr)<100:break
            except Exception as e:errors.append(str(e));break
          missing=[{'path':k,'url':v} for k,v in active.items() if k not in seen]
          for row in missing:
            try:
              r=s.get(row['url'],timeout=30,allow_redirects=False)
              soup=BeautifulSoup(r.text,'html.parser')
              can=soup.find('link',rel='canonical')
              robots=soup.find('meta',attrs={'name':'robots'})
              row.update({'status':r.status_code,'canonical':can.get('href') if can else None,'robots':robots.get('content') if robots else None,
                'title':soup.title.get_text(' ',strip=True) if soup.title else None,
                'body_classes':soup.body.get('class',[])[:15] if soup.body else []})
            except Exception as e:row['error']=str(e)
          old=['/humming-noise-increases-with-speed-wheel-bearing-tires-gearbox/',
               '/car-overheats-in-traffic-cools-when-driving-fan-thermostat-diagnosis/',
               '/car-battery-parasitic-draw-diagnosis/',
               '/opel-insignia-spare-parts-prices-guide-egypt-2026/']
          report={'sitemap_urls':len(active),'rest_posts':len(seen),'missing_sitemap_from_rest':missing,'errors':errors,
            'four_legacy_sources_in_sitemap':[p for p in old if p in active]}
          print('COVERAGE_REPORT',json.dumps(report,ensure_ascii=False),flush=True)
          PY
