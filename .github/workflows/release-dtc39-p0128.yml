name: Publish illustrated DTC39 P0128 thermostat guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dtc39-p0128.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3TAL_BATCH39_RELEASE: '1'
      A3TAL_DTC39_CODE: P0128
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pillow and Arabic typography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install -q Pillow
      - name: Validate original 1500 word guide and component illustration
        run: |
          python3 -m py_compile scripts/release-dtc-batch39-component.py scripts/render-dtc-batch39-component-images.py
          python3 - <<'PY'
          import json,re
          a=json.load(open('data/dtc-batch39-p0128-20261031.json',encoding='utf8'))
          assert a['batch']==39 and len(a['items'])==1
          r=a['items'][0]
          w=len(re.sub(r'<[^>]+>',' ',r['content']).split())
          assert r['code']=='P0128' and w>=1500 and r['word_count']==w and r['qa']['ready_for_publication']
          print('DTC39_P0128_EDITORIAL_PASS',w)
          PY
          python3 scripts/render-dtc-batch39-component-images.py P0128
      - name: Publish and check live featured unique art and Open Graph
        run: python3 -u scripts/release-dtc-batch39-component.py
