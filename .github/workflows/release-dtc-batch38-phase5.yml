name: Publish reviewed DTC batch38 phase5 P0486
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dtc-batch38-phase5.yml']
permissions: {contents: read}
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3TAL_BATCH38_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow WebP support
        run: python3 -m pip install -q Pillow
      - name: Check article quality and exact code
        run: |
          python3 -m py_compile scripts/release-dtc-batch38-phase5.py
          python3 - <<'PY'
          import json,re
          a=json.load(open('data/dtc-batch38-phase5-p0486.json',encoding='utf8'))
          assert a['batch']==38 and a['phase']==5 and len(a['items'])==1
          r=a['items'][0]
          wc=len(re.sub(r'<[^>]+>',' ',r['content']).split())
          assert r['code']=='P0486' and r['slug']=='p0486' and r['qa']['ready_for_publication']
          assert wc>=1500 and wc==r['word_count'] and r['content'].count('<h2>')>=16
          print('DTC38_PHASE5_VALIDATED',r['code'],wc)
          PY
      - name: Publish and verify photograph WebP and OpenGraph
        run: python3 -u scripts/release-dtc-batch38-phase5.py
