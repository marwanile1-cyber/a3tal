name: Audit A3tal site speed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-site-speed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: HTTP timing, caching and payload baseline
        shell: bash
        run: |
          set -uo pipefail
          for route in / /cars/ /dtc/; do
            for pass in 1 2 3; do
              h="$(mktemp)"
              metrics="$(curl -sS -L --connect-timeout 12 --max-time 40 --retry 1 --retry-delay 2 \
                -A 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36' \
                -D "$h" -o /dev/null -w 'status=%{http_code} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} size=%{size_download} remote=%{remote_ip}' \
                "https://a3tal.com$route" 2>&1)"
              echo "HTTP_AUDIT route=$route pass=$pass $metrics cf=$(grep -im1 '^cf-cache-status:' "$h" | cut -d: -f2- | tr -d '\r' | xargs) ls=$(grep -im1 '^x-litespeed-cache:' "$h" | cut -d: -f2- | tr -d '\r' | xargs) cache=$(grep -im1 '^cache-control:' "$h" | cut -d: -f2- | tr -d '\r' | xargs) server=$(grep -im1 '^server:' "$h" | cut -d: -f2- | tr -d '\r' | xargs)"
              rm -f "$h"
            done
          done
      - name: Check Google variable font API compatibility
        shell: bash
        run: |
          set -euo pipefail
          FONT_URL="https://fonts.googleapis.com/css2?family=Alexandria:wght@500..800&family=IBM+Plex+Sans+Arabic:wght@400..700&display=swap"
          curl -fsSL --retry 2 --max-time 25 -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36" "$FONT_URL" -o /tmp/a3tal-variable-fonts.css
          echo "VARIABLE_FONT_CSS_BYTES $(wc -c </tmp/a3tal-variable-fonts.css)"
          grep -E 'font-family:|font-weight:' /tmp/a3tal-variable-fonts.css | sort -u | head -18
      - name: Verify live mobile CSS paint patch and version
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 30 "https://a3tal.com/wp-content/themes/a3tal-global/style.css?ver=1.7.6" -o /tmp/a3tal-paint.css
          grep -Fq "A3TAL-MOBILE-PAINT-20261018" /tmp/a3tal-paint.css
          curl -fsSL --retry 2 --max-time 30 https://a3tal.com/ -o /tmp/a3tal-main.html
          grep -Fq 'style.css?ver=1.7.6' /tmp/a3tal-main.html
          echo 'LIVE_MOBILE_CSS_PATCH_VERIFIED'
          python3 - <<'PY'
          import re
          html=open('/tmp/a3tal-main.html',encoding='utf-8').read()
          links=re.findall(r'<link\b[^>]*>',html,re.I)
          hero=[s for s in links if 'rel="preload"' in s and 'as="image"' in s]
          assert len(hero)==1,('Unexpected homepage image preload count',len(hero))
          assert 'imagesrcset=' in hero[0] and 'imagesizes=' in hero[0] and 'fetchpriority="high"' in hero[0]
          print('HERO_IMAGE_PRELOAD_VERIFIED',hero[0][:500])
          PY
      - name: Lighthouse mobile homepage
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npx --yes lighthouse@12.8.2 https://a3tal.com/ --chrome-path=/usr/bin/google-chrome --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --form-factor=mobile --screenEmulation.mobile=true --throttling-method=simulate --output=json --output-path=/tmp/a3tal-lighthouse.json --quiet
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then echo "LIGHTHOUSE_FAILED code=$result"; exit 0; fi
          node - <<'JS'
          const l=require('/tmp/a3tal-lighthouse.json'),a=l.audits;
          const metrics=['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','server-response-time','render-blocking-resources','unused-css-rules','unused-javascript','largest-contentful-paint-element','lcp-discovery-insight','lcp-breakdown-insight','network-dependency-tree-insight','document-latency-insight','font-display-insight','image-delivery-insight'];
          console.log('LIGHTHOUSE_SCORE',Math.round((l.categories.performance.score||0)*100));
          for(const k of metrics)if(a[k])console.log('LH_AUDIT',k,JSON.stringify({score:a[k].score,display:a[k].displayValue,details:Array.isArray(a[k].details?.items)?a[k].details.items.slice(0,4):a[k].details?.items}).slice(0,2000));
          console.log('LH_RESOURCES',JSON.stringify((l.audits['network-requests']?.details?.items||[]).filter(x=>/\.css|\.js|\.woff|\.webp|\.jpg|\.png|fonts\.google/i.test(x.url||'')).slice(0,30).map(x=>({url:x.url,resourceSize:x.resourceSize,transferSize:x.transferSize,startTime:x.startTime,endTime:x.endTime}))).slice(0,8000));
          JS
      - name: Lighthouse independent confirmation run
        shell: bash
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.8.2 https://a3tal.com/ --chrome-path=/usr/bin/google-chrome --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --form-factor=mobile --screenEmulation.mobile=true --throttling-method=simulate --output=json --output-path=/tmp/a3tal-lighthouse-confirm.json --quiet
          node - <<'JS'
          const r=require('/tmp/a3tal-lighthouse-confirm.json');
          const m=r.audits;
          console.log('CONFIRM_SCORE',Math.round(r.categories.performance.score*100));
          for(const key of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift']){
            console.log('CONFIRM_METRIC',key,m[key].numericValue,m[key].displayValue);
          }
          JS
      - name: Store Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3tal-speed-baseline-${{ github.run_id }}
          path: |
            /tmp/a3tal-lighthouse.json
            /tmp/a3tal-lighthouse-confirm.json
          if-no-files-found: ignore
          retention-days: 7
