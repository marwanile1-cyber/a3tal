name: Verify Car Reference Sitemap After MG ZS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-car-reference-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live MG ZS URLs in sitemap and reference engine health
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          import re
          import json
          site="https://a3tal.com"
          def fetch(url):
            req=urllib.request.Request(url,headers={"User-Agent":"A3tal-Reference-Sitemap-Audit/1.0","Cache-Control":"no-cache"})
            with urllib.request.urlopen(req,timeout=70) as r:
              status=r.status
              text=r.read().decode('utf8',errors='replace')
              print("FETCH",url,"http",status,"length",len(text),"type",r.headers.get('Content-Type'))
              if status!=200: raise RuntimeError("Bad response "+url)
              return text
          health=json.loads(fetch(site+"/wp-json/a3tal-car-reference/v1/health"))
          assert health["ok"] and health["published"]>=90 and health["drafts"]==0
          x=fetch(site+"/a3_car_ref-sitemap.xml")
          expected=[
            "/car-reference/mg/zs-legacy-4at-egypt/",
            "/car-reference/mg/zs-legacy-4at-egypt/zs-old-egypt-tires-16-17-2023-brochure/",
            "/car-reference/mg/zs-legacy-4at-egypt/zs-old-egypt-engine-15-4at-specs/",
            "/car-reference/mg/zs-legacy-4at-egypt/zs-old-egypt-tank-boot-dimensions/",
            "/car-reference/mg/zs-legacy-4at-egypt/zs-old-egypt-airbags-esp-trims/",
          ]
          for item in expected:
            if item not in x:raise RuntimeError("Missing sitemap record "+item)
            print("VERIFIED",item)
          locs=re.findall(r"<loc>([^<]+)</loc>",x)
          print("SITEMAP TOTAL",len(locs),"HEALTH",health)
          assert len(locs)>=91, "Sitemap count below expected despite published records"
          print("SUCCESS: sitemap includes all new MG ZS records")
          PY
