name: Publish GAC Empow 2027 Discover Article

on:
  push:
    paths:
      - '.github/workflows/publish-gac-empow-2027.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      BASE: https://a3tal.com/wp-json/a3tal-direct/v1
      SITE: https://a3tal.com
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet pillow requests beautifulsoup4

      - name: Publish article with photorealistic images
        shell: bash
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          cat > /tmp/publish_gac_empow.py <<'PY'
          import os, re, io, json, base64, time
          import requests
          from PIL import Image
          from bs4 import BeautifulSoup

          SITE=os.environ["SITE"].rstrip("/")
          BASE=os.environ["BASE"].rstrip("/")
          KEY=os.environ["A3TAL_API_KEY"]
          HEAD={"X-A3tal-Key":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"}
          UA={"User-Agent":"A3talEditorialBot/2026"}

          with open("publish-payloads/gac-empow-2027-discover.json","r",encoding="utf-8") as f:
              a=json.load(f)

          def words(html):
              return len(re.findall(r"\S+",BeautifulSoup(html,"html.parser").get_text(" ",strip=True)))

          if words(a["content"]) < 1200:
              raise RuntimeError("Article under 1200 words")

          dup=requests.get(SITE+"/wp-json/wp/v2/posts",params={"slug":a["slug"],"_fields":"id,link,status"},headers=UA,timeout=40)
          dup.raise_for_status()
          if dup.json():
              raise RuntimeError("Slug already exists: "+a["slug"])

          def make_webp(src,dst):
              im=Image.open(src).convert("RGB")
              w,h=im.size
              target=16/9
              cur=w/h
              if cur>target:
                  nw=int(h*target); left=(w-nw)//2
                  im=im.crop((left,0,left+nw,h))
              elif cur<target:
                  nh=int(w/target); top=(h-nh)//2
                  im=im.crop((0,top,w,top+nh))
              im=im.resize((1600,900),Image.Resampling.LANCZOS)
              im.save(dst,"WEBP",quality=90,method=6)

          os.makedirs("/tmp/gac",exist_ok=True)
          feat="/tmp/gac/gac-empow-2027-featured.webp"
          inline="/tmp/gac/gac-empow-2027-showroom.webp"
          make_webp(a["source_featured"],feat)
          make_webp(a["source_inline"],inline)

          def b64(path):
              with open(path,"rb") as f:
                  return base64.b64encode(f.read()).decode("ascii")

          def post_json(path,payload,timeout=180):
              for attempt in range(6):
                  r=requests.post(BASE+path,headers=HEAD,json=payload,timeout=timeout)
                  if r.status_code==429:
                      time.sleep(6*(attempt+1)); continue
                  if not (200 <= r.status_code < 300):
                      raise RuntimeError(f"{path} HTTP {r.status_code}: {r.text[:1600]}")
                  return r.json()
              raise RuntimeError("Rate limit persisted for "+path)

          canonical=SITE+"/"+a["slug"]+"/"
          meta={
            "_yoast_wpseo_focuskw":a["focus_keyword"],
            "_yoast_wpseo_title":a["seo_title"]+" | أعطال.كوم",
            "_yoast_wpseo_metadesc":a["meta_description"],
            "_yoast_wpseo_canonical":canonical,
            "_yoast_wpseo_opengraph-title":a["seo_title"]+" | أعطال.كوم",
            "_yoast_wpseo_opengraph-description":a["meta_description"],
            "_yoast_wpseo_twitter-title":a["seo_title"]+" | أعطال.كوم",
            "_yoast_wpseo_twitter-description":a["meta_description"]
          }

          bundle={
            "post":{
              "title":a["title"],
              "slug":a["slug"],
              "content":a["content"],
              "excerpt":a["excerpt"],
              "status":"publish",
              "categories":a["categories"],
              "tags":a["tags"],
              "meta":meta
            },
            "media":[
              {
                "key":"featured","role":"featured","set_featured":True,
                "image_base64":b64(feat),
                "filename":"gac-empow-2027-egypt-featured.webp",
                "title":a["featured_alt"],"alt":a["featured_alt"],
                "convert_webp":False
              },
              {
                "key":"inline","role":"inline","placeholder":"{{a3tal_image:inline}}",
                "image_base64":b64(inline),
                "filename":"gac-empow-2027-showroom.webp",
                "title":a["inline_alt"],"alt":a["inline_alt"],
                "convert_webp":False
              }
            ]
          }

          res=post_json("/publish-bundle",bundle)
          post=res["post"]; media=res["media"]
          pid=int(post["id"])
          featured=media["featured"]; inl=media["inline"]

          post_json("/admin",{
            "op":"post_meta_set",
            "post_id":pid,
            "meta":{
              "_yoast_wpseo_opengraph-image":featured["url"],
              "_yoast_wpseo_opengraph-image-id":str(featured["media_id"]),
              "_yoast_wpseo_twitter-image":featured["url"],
              "_yoast_wpseo_twitter-image-id":str(featured["media_id"])
            }
          })
          post_json("/update-post",{"id":pid,"status":"publish"})
          post_json("/admin",{"op":"cache_flush"})
          time.sleep(4)

          api=requests.get(SITE+"/wp-json/wp/v2/posts/"+str(pid),params={"_fields":"id,link,status,slug,featured_media,categories,content,title"},headers=UA,timeout=45)
          api.raise_for_status(); j=api.json()
          if j.get("status")!="publish":
              raise RuntimeError("Post not published")
          if int(j.get("featured_media") or 0)!=int(featured["media_id"]):
              raise RuntimeError("Featured image mismatch")
          if 22 not in j.get("categories",[]):
              raise RuntimeError("Category 22 missing")
          rendered=j.get("content",{}).get("rendered","")
          if inl["url"] not in rendered:
              raise RuntimeError("Inline image missing")
          if words(rendered) < 1200:
              raise RuntimeError("Live content under 1200 words")

          html=requests.get(canonical,headers=UA,timeout=45).text
          soup=BeautifulSoup(html,"html.parser")
          can=soup.find("link",rel="canonical")
          if not can or can.get("href","").rstrip("/")!=canonical.rstrip("/"):
              raise RuntimeError("Canonical mismatch")
          robots=soup.find("meta",attrs={"name":"robots"})
          rv=(robots.get("content","") if robots else "").lower()
          if "index" not in rv or "follow" not in rv or "max-image-preview:large" not in rv:
              raise RuntimeError("Robots/max-image-preview mismatch")
          og=soup.find("meta",attrs={"property":"og:image"})
          if not og or featured["url"] not in og.get("content",""):
              raise RuntimeError("OG image mismatch")
          if featured["url"] not in html or inl["url"] not in html:
              raise RuntimeError("One or more new images missing from live HTML")
          if len(soup.find_all("h1")) != 1:
              raise RuntimeError("Unexpected H1 count")

          sm=requests.get(SITE+"/post-sitemap.xml",headers=UA,timeout=60).text
          if canonical not in sm:
              time.sleep(5)
              sm=requests.get(SITE+"/post-sitemap.xml?cb="+str(int(time.time())),headers=UA,timeout=60).text
          if canonical not in sm:
              raise RuntimeError("Article missing from sitemap")

          result={
            "id":pid,
            "url":canonical,
            "featured_url":featured["url"],
            "inline_url":inl["url"],
            "words":words(rendered),
            "category":22
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          with open("/tmp/result.json","w",encoding="utf-8") as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          PY
          python /tmp/publish_gac_empow.py

      - name: Show verified result
        run: cat /tmp/result.json
