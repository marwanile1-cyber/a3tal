name: Audit existing live DTC batch31 content and SEO
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-dtc-batch31-quality-20261022.yml
      - scripts/audit-dtc-batch31-quality-20261022.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect 10 live batch31 posts without modification
        run: python3 -u scripts/audit-dtc-batch31-quality-20261022.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch31-live-quality
          path: dtc-batch31-live-quality-report.json
          if-no-files-found: warn
