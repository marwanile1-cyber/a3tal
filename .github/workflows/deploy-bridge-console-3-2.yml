name: Deploy A3tal Bridge Console 3.3.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-bridge-console-3-2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3tal-live-bridge-upgrade
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      BASE_URL: https://a3tal.com/wp-json/a3tal-direct/v1
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and existing secret
        shell: bash
        run: |
          set -euo pipefail
          php -l a3tal-direct-bridge.php
          test -n "$A3TAL_API_KEY" || { echo "Missing A3TAL_API_KEY secret"; exit 1; }
      - name: Check existing live authenticated bridge
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 \
            -H "X-A3tal-Key: $A3TAL_API_KEY" "$BASE_URL/status?bridge_verify=$(date +%s%N)" > /tmp/a3tal-before.json
          jq -e '.ok == true and .plugin == "A3tal Direct Bridge"' /tmp/a3tal-before.json >/dev/null
          echo "Live version before: $(jq -r '.version' /tmp/a3tal-before.json)"
      - name: Upgrade live plugin from checksum-verified repository source
        shell: bash
        run: |
          set -euo pipefail
          # A previous self-update can succeed even if the old OPcache response
          # persists until the first verification window has elapsed.
          if jq -e '.version == "3.3.1"' /tmp/a3tal-before.json >/dev/null; then
            echo "Live Bridge is already v3.3.1. No redundant production mutation."
            exit 0
          fi
          EXPECTED="$(sha256sum a3tal-direct-bridge.php | awk '{print $1}')"
          jq -n --arg expected "$EXPECTED" '{op:"bridge_self_update",confirm:true,dangerous:true,expected_sha256:$expected}' > /tmp/a3tal-upgrade-request.json
          # GitHub raw/main can briefly lag the contents API after a push.
          # The bridge enforces SHA256; wait for its downloaded bytes to match
          # the validated checkout rather than removing that safety check.
          for attempt in $(seq 1 12); do
            CODE="$(curl --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -o /tmp/a3tal-upgrade-response.json -w '%{http_code}' \
              -X POST -H "X-A3tal-Key: $A3TAL_API_KEY" -H "Content-Type: application/json" \
              --data-binary @/tmp/a3tal-upgrade-request.json "$BASE_URL/admin")"
            echo "Upgrade attempt $attempt HTTP: $CODE"
            if [[ "$CODE" == "200" ]]; then break; fi
            REASON="$(jq -r '.code // ""' /tmp/a3tal-upgrade-response.json 2>/dev/null || true)"
            if [[ "$CODE" != "409" || "$REASON" != "a3tal_bridge_checksum_mismatch" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then
            jq '{code,message,data}' /tmp/a3tal-upgrade-response.json || true
            exit 1
          fi
          jq -e '.ok == true and .result.updated == true and .result.version == "3.3.1"' /tmp/a3tal-upgrade-response.json >/dev/null
          echo "Checksum-verified upgrade applied with server-side rollback copy."
      - name: Verify live 3.3.1 with OPcache warmup
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error --retry 2 --retry-all-errors --connect-timeout 15 --max-time 60 \
              -H "X-A3tal-Key: $A3TAL_API_KEY" "$BASE_URL/status?bridge_verify=$(date +%s%N)" > /tmp/a3tal-after.json
            ACTIVE="$(jq -r '.version // "unknown"' /tmp/a3tal-after.json)"
            echo "Attempt $attempt: bridge REST runtime version $ACTIVE"
            if [[ "$ACTIVE" == "3.3.1" ]]; then
              jq -e '.ok == true and .plugin == "A3tal Direct Bridge"' /tmp/a3tal-after.json >/dev/null
              echo "Live bridge update fully verified."
              exit 0
            fi
            sleep 5
          done
          echo "Bridge file update succeeded but active PHP runtime still reports an older version; inspect OPcache."
          exit 1
