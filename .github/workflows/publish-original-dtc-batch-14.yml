name: Publish mixed P U C B diagnostic guides - Batch 14
on:
  workflow_run:
    workflows:
      - Publish exclusive P U C B covers - Batch 13
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate unique reviewed 1P 2U 1C 1B DTC articles
        run: |
          python3 -m py_compile scripts/publish-dtc-original-batch-14.py
          python3 scripts/publish-dtc-original-batch-14.py --dry-run
      - name: Require all batch13 article images and share images to pass public inspection
        run: python3 -u scripts/audit-dtc-og-images.py --batch 13
      - name: Publish five new reviewed DTCs through backup-aware duplicate-guarded bridge
        run: python3 -u scripts/publish-dtc-original-batch-14.py
