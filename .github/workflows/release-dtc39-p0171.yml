name: Publish illustrated DTC39 P0171 fuel trim guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dtc39-p0171.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3TAL_BATCH39_RELEASE: '1'
      A3TAL_DTC39_CODE: P0171
    steps:
      - uses: actions/checkout@v4
      - name: Install Arabic fonts and WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install -q Pillow
      - name: Validate independent article and original intake illustration
        run: |
          python3 -m py_compile scripts/release-dtc-batch39-component.py scripts/render-dtc-batch39-component-images.py
          python3 - <<'PY'
          import re,json
          a=json.load(open('data/dtc-batch39-p0171-20261031.json',encoding='utf8'))
          assert a['batch']==39 and len(a['items'])==1
          row=a['items'][0]
          wc=len(re.sub(r'<[^>]+>',' ',row['content']).split())
          assert row['code']=='P0171' and row['qa']['ready_for_publication'] and wc>=1500 and row['word_count']==wc
          print('DTC39_P0171_EDITORIAL_PASS',wc)
          PY
          python3 scripts/render-dtc-batch39-component-images.py P0171
      - name: Publish via Direct Bridge and verify WebP and OG
        run: python3 -u scripts/release-dtc-batch39-component.py
