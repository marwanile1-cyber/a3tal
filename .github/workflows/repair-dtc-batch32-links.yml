name: Clean batch32 unverified DTC links after live image checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-dtc-batch32-links.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check guarded link quality pass
        run: python3 -m py_compile scripts/repair-dtc-batch32-links.py
      - name: Remove only nonexistent internal DTC anchors with revision locking
        run: python3 -u scripts/repair-dtc-batch32-links.py
