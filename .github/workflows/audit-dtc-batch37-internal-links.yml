name: Final crosslink integrity QA DTC batch37
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-dtc-batch37-internal-links.yml']
  workflow_run:
    workflows: ['Repair unpublished DTC crosslinks in batch37']
    types: [completed]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/audit-dtc-batch37-internal-links.py
