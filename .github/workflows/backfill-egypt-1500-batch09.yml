name: Rebuild Megane gearbox Tucson infotainment and DCT to 1500 words
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-egypt-1500-batch09.yml'
      - 'scripts/backfill-egypt-1500-batch09.py'
      - 'data/expansions/egypt-1500-rebuild-batch09-20261020.json'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate script and 1500 word source manuscript
        run: |
          python3 -m py_compile scripts/editorial_minimum_words.py scripts/backfill-egypt-1500-batch09.py
          python3 -m json.tool data/expansions/egypt-1500-rebuild-batch09-20261020.json >/dev/null
      - name: Upgrade three articles in place and verify min word count after WordPress save
        run: python3 -u scripts/backfill-egypt-1500-batch09.py
