name: Build locally hosted global garage brand art

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-dtc-brand-logos.py'
      - '.github/workflows/build-dtc-brand-logos.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: a3tal-brand-art
  cancel-in-progress: false

jobs:
  brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: vehiclespecs/brand-logos
          ref: 3f0929e70e0a9a2a502063edc4b3e5c0146cba74
          path: _verified_brand_source
      - uses: actions/checkout@v4
        with:
          repository: filippofilip95/car-logos-dataset
          ref: bb2d661f28ce617dba8a51bdfc2069a3381a23b0
          path: _fallback_brand_source
          filter: blob:none
          sparse-checkout: |
            logos/thumb
      - name: Prepare image tooling
        run: python3 -m pip install --disable-pip-version-check --quiet pillow cairosvg
      - name: Build color-accurate WebP brand marks embedded in one local JS asset
        run: |
          python3 scripts/build-dtc-brand-logos.py --logo-repo _verified_brand_source --fallback-dir _fallback_brand_source/logos/thumb
          node --check theme-source/a3tal-global/assets/js/dtc-brand-logos.generated.js
          test $(wc -c < theme-source/a3tal-global/assets/js/dtc-brand-logos.generated.js) -gt 30000
      - name: Commit reproducible local asset (not a runtime CDN)
        run: |
          git config user.name "a3tal-logo-builder[bot]"
          git config user.email "a3tal-logo-builder[bot]@users.noreply.github.com"
          git add theme-source/a3tal-global/assets/js/dtc-brand-logos.generated.js
          git diff --cached --quiet || { git commit -m "assets(dtc): add verified manufacturer logos from two pinned sources"; git push origin HEAD:main; }
      - name: Deploy logo bundle through reviewed direct bridge workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-dtc-world-garage.yml --ref main
