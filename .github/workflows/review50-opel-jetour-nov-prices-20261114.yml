name: A3tal human50 price correction - Opel Frontera and Jetour T2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review50-opel-jetour-nov-prices-20261114.yml'
      - 'scripts/review50-opel-jetour-nov-prices-20261114.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-egypt-editorial-content-write
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check source integrity
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY" || { echo "Missing Bridge key"; exit 1; }
          python3 -m py_compile scripts/review50-opel-jetour-nov-prices-20261114.py
          python3 -m py_compile scripts/review-human-seo-geo-egypt-three-20261114.py
      - name: Protect original articles and publish sourced price updates
        run: python3 -u scripts/review50-opel-jetour-nov-prices-20261114.py
