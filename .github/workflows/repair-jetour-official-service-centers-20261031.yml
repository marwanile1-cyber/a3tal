name: Update Jetour verified service center directory article 2026-10-31
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-jetour-official-service-centers-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-jetour-service-article-official-20261031
  cancel-in-progress: false
jobs:
  guarded-jetour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bridge secret and syntax
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY" || { echo "Missing bridge secret"; exit 1; }
          python3 -m py_compile scripts/repair-jetour-official-service-centers-20261031.py
      - name: Patch approved Jetour article then verify exact post and SEO integrity
        run: python3 -u scripts/repair-jetour-official-service-centers-20261031.py
