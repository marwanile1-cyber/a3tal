name: Fix Motorcycle Social Images

on:
  push:
    paths:
      - '.github/workflows/fix-moto-social-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      BASE: https://a3tal.com/wp-json/a3tal-direct/v1
      SITE: https://a3tal.com
    steps:
      - uses: actions/checkout@v4

      - name: Set Yoast social images and refresh posts
        shell: bash
        run: |
          set -euo pipefail

          api_post() {
            local path="$1" body="$2" out="$3"
            local status
            status=$(curl --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors               -o "$out" -w "%{http_code}" -X POST               -H "X-A3tal-Key: $A3TAL_API_KEY"               -H "Authorization: Bearer $A3TAL_API_KEY"               -H "Content-Type: application/json"               --data-binary @"$body" "$BASE$path")
            echo "POST $path -> HTTP $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              cat "$out"; exit 21
            fi
          }

          fix_one() {
            local slug="$1" media_id="$2" media_url="$3"
            local post_json="/tmp/$slug-post.json"
            curl -fsSL --retry 4 "$SITE/wp-json/wp/v2/posts?slug=$slug&_fields=id,link" > "$post_json"
            local post_id
            post_id=$(jq -r '.[0].id // empty' "$post_json")
            test -n "$post_id" || { echo "Post not found $slug"; exit 22; }

            jq -n               --argjson post_id "$post_id"               --arg url "$media_url"               --arg id "$media_id"               '{
                op:"post_meta_set",
                post_id:$post_id,
                meta:{
                  "_yoast_wpseo_opengraph-image":$url,
                  "_yoast_wpseo_opengraph-image-id":$id,
                  "_yoast_wpseo_twitter-image":$url,
                  "_yoast_wpseo_twitter-image-id":$id
                }
              }' > "/tmp/$slug-meta.json"
            api_post "/admin" "/tmp/$slug-meta.json" "/tmp/$slug-meta-response.json"

            jq -n --argjson id "$post_id" '{id:$id,status:"publish"}' > "/tmp/$slug-refresh.json"
            api_post "/update-post" "/tmp/$slug-refresh.json" "/tmp/$slug-refresh-response.json"
          }

          fix_one "dayun-4a-150-egypt-review" "83236" "https://a3tal.com/wp-content/uploads/2026/10/dayun4a-featured-correct.webp"
          fix_one "hogen-3-150-egypt-review" "83237" "https://a3tal.com/wp-content/uploads/2026/10/hogen3-featured-correct.webp"
          fix_one "halawa-express-150-egypt-review" "83238" "https://a3tal.com/wp-content/uploads/2026/10/halawaexpress-featured-correct.webp"
          fix_one "haoji-ka150-egypt-review" "83239" "https://a3tal.com/wp-content/uploads/2026/10/haojika150-featured-correct.webp"

          jq -n '{op:"cache_flush"}' > /tmp/cache.json
          api_post "/admin" /tmp/cache.json /tmp/cache-response.json

      - name: Verify OG images
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local url="$1" expected="$2"
            HTML=$(curl -fsSL --retry 5 --retry-delay 3 "$url")
            echo "VERIFY $url"
            if ! grep -Fq "property=\"og:image\" content=\"$expected\"" <<<"$HTML" &&                ! grep -Fq "content=\"$expected\" property=\"og:image\"" <<<"$HTML"; then
              echo "Expected og:image not found: $expected"
              grep -oE '<meta[^>]+og:image[^>]+>' <<<"$HTML" | head -5 || true
              exit 31
            fi
            if ! grep -qi 'max-image-preview:large' <<<"$HTML"; then exit 32; fi
          }
          check "https://a3tal.com/dayun-4a-150-egypt-review/" "https://a3tal.com/wp-content/uploads/2026/10/dayun4a-featured-correct.webp"
          check "https://a3tal.com/hogen-3-150-egypt-review/" "https://a3tal.com/wp-content/uploads/2026/10/hogen3-featured-correct.webp"
          check "https://a3tal.com/halawa-express-150-egypt-review/" "https://a3tal.com/wp-content/uploads/2026/10/halawaexpress-featured-correct.webp"
          check "https://a3tal.com/haoji-ka150-egypt-review/" "https://a3tal.com/wp-content/uploads/2026/10/haojika150-featured-correct.webp"
          echo "All four OG images are correct."
