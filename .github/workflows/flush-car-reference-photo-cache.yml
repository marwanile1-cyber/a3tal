name: Flush A3tal Car Reference photo cache and verify current OG
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flush-car-reference-photo-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3tal-car-reference-cache-purge
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - name: Purge WordPress cache via Direct Bridge admin gateway
        shell: bash
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 90 \
            -X POST "https://a3tal.com/wp-json/a3tal-direct/v1/admin" \
            -H "X-A3tal-Key: $A3TAL_API_KEY" -H "Content-Type: application/json" \
            --data '{"op":"cache_flush"}' > /tmp/a3tal-cache-flush.json
          jq -e '.ok == true' /tmp/a3tal-cache-flush.json >/dev/null
          echo "WordPress object/transient cache refresh requested successfully"
      - name: Verify rewritten OG image at source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,time
          base="https://a3tal.com/car-reference/kia/"
          sample={
          "cerato-bd-2023/automatic-transmission-fluid-16/":"a3tal-verified-photo-automatic-transmission-fluid-16.webp",
          "seltos-sp2-2023/manual-fluid-16-awd/":"a3tal-verified-photo-manual-fluid-16-awd.webp",
          "sportage-nq5-2023/fuel-tank/":"a3tal-verified-photo-fuel-tank.webp",
          }
          for path,expected in sample.items():
              url=base+path+"?cache_audit="+str(time.time_ns())
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"A3tal-Tech-Audit/1.0"})
              with urllib.request.urlopen(req,timeout=45) as r:
                  html=r.read().decode("utf8",errors="replace")
              tags=re.findall(r"<meta\b[^>]*>",html,re.I)
              imgs=[t for t in tags if re.search(r"\bproperty=['\"]og:image['\"]",t,re.I)]
              if not imgs or expected not in imgs[0]:
                  raise RuntimeError("Stale OG image for "+path)
              print("VERIFIED",path,expected)
          PY
