name: Build A3tal Global Theme

on:
  push:
    branches: [main]
    paths:
      - "theme-source/a3tal-global/**"
      - ".github/workflows/build-a3tal-global.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          set -euo pipefail
          find theme-source/a3tal-global -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build zip
        run: |
          set -euo pipefail
          rm -f theme-builds/a3tal-global.zip
          mkdir -p theme-builds
          cd theme-source
          zip -qr ../theme-builds/a3tal-global.zip a3tal-global
          cd ..
          unzip -l theme-builds/a3tal-global.zip | head -30
      - name: Commit build
        run: |
          set -euo pipefail
          git config user.name "A3tal Build Bot"
          git config user.email "build@a3tal.com"
          git add theme-builds/a3tal-global.zip
          if git diff --cached --quiet; then
            echo "No build changes"
          else
            git commit -m "Build A3tal Global theme package"
            git push
          fi
