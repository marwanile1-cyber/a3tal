name: Publish illustrated DTC39 P0136 original guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dtc39-p0136.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      A3TAL_BATCH39_RELEASE: '1'
      A3TAL_DTC39_CODE: P0136
    steps:
      - uses: actions/checkout@v4
      - name: Install Arabic fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install -q Pillow
      - name: Validate researched article and exclusive illustrated photo
        run: |
          python3 -m py_compile scripts/release-dtc-batch39-component.py scripts/render-dtc-batch39-component-images.py
          python3 - <<'PY'
          import json,re
          c="P0136"
          d=json.load(open('data/dtc-batch39-'+c.lower()+'-20261031.json',encoding='utf8'))
          assert d['batch']==39 and len(d['items'])==1
          r=d['items'][0]
          wc=len(re.sub(r'<[^>]+>',' ',r['content']).split())
          assert r['code']==c and r['slug']==c.lower() and r['qa']['ready_for_publication'] and r['media_status']=='awaiting_original_component_infographic'
          assert wc>=1500 and wc==r['word_count'] and r['content'].count('<h2>')>=16
          print('DTC39_EDITORIAL_PASS',c,wc,flush=True)
          PY
          python3 scripts/render-dtc-batch39-component-images.py P0136
      - name: Publish with live duplicate guard and verify WebP/OG
        run: python3 -u scripts/release-dtc-batch39-component.py

# Serialized rerun after completion of the P0400 production release.
