name: Publish two original HVAC and brake diagnostic infographics after quality correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-egypt-quality80-batch09-diagrams-20261020.yml'
      - 'scripts/attach-egypt-quality80-batch09-diagrams-20261020.py'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow arabic-reshaper python-bidi
      - name: Add and verify custom illustrated flows while keeping each featured image
        run: python3 -u scripts/attach-egypt-quality80-batch09-diagrams-20261020.py
