name: Deploy A3TAL global garage (scoped)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'theme-source/a3tal-global/assets/js/dtc-brand-logos.generated.js'
      - 'theme-source/a3tal-global/dtc-world-garage.css'
      - 'theme-source/a3tal-global/dtc-model-links.php'
      - 'theme-source/a3tal-global/dtc-model-links.css'
      - 'theme-source/a3tal-global/assets/js/dtc-world-garage.js'

permissions:
  contents: read

concurrency:
  group: a3tal-production-theme
  cancel-in-progress: false

jobs:
  deploy-world-garage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate scoped PHP, JS and Python before reaching production
        run: |
          php -l theme-source/a3tal-global/dtc-world-garage.php
          php -l theme-source/a3tal-global/dtc-model-links.php
          php -l theme-source/a3tal-global/dtc-library-archive.php
          php -l theme-source/a3tal-global/dtc-library-support.php
          node --check theme-source/a3tal-global/assets/js/dtc-world-garage.js
          node --check theme-source/a3tal-global/assets/js/dtc-brand-logos.generated.js
          python3 -m py_compile scripts/deploy-dtc-library.py scripts/deploy-dtc-world-garage.py
      - name: Snapshot original live files without changing site
        run: python3 scripts/deploy-dtc-world-garage.py prepare --state-dir "$RUNNER_TEMP/world-garage"
      - name: Encrypt live rollback snapshot
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:A3TAL_API_KEY \
            -in "$RUNNER_TEMP/world-garage/snapshot.json" -out "$RUNNER_TEMP/world-garage/backup.enc"
      - name: Preserve encrypted rollback
        uses: actions/upload-artifact@v4
        with:
          name: a3tal-world-garage-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/world-garage/backup.enc
          retention-days: 7
          if-no-files-found: error
      - name: Install assets first and verified archive last
        run: python3 scripts/deploy-dtc-world-garage.py deploy --state-dir "$RUNNER_TEMP/world-garage"
