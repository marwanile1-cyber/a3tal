name: Replace Diagnostic Article Images With Live Photos

on:
  push:
    paths:
      - '.github/workflows/replace-diagnostic-live-photos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
      BASE: https://a3tal.com/wp-json/a3tal-direct/v1
      SITE: https://a3tal.com
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet pillow requests beautifulsoup4

      - name: Replace six article images
        shell: bash
        run: |
          set -euo pipefail
          test -n "$A3TAL_API_KEY"
          cat > /tmp/replace_live_photos.py <<'PY'
          import os, io, re, json, base64, time
          import requests
          from PIL import Image
          from bs4 import BeautifulSoup

          SITE=os.environ["SITE"].rstrip("/")
          BASE=os.environ["BASE"].rstrip("/")
          KEY=os.environ["A3TAL_API_KEY"]
          HEAD={"X-A3tal-Key":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"}
          UA={"User-Agent":"A3talEditorialBot/2026"}

          ITEMS=[
            {
              "id":83240,
              "slug":"p0562-system-voltage-low-diagnosis",
              "src":"temp-media/live-photo-replacements/p0562-live-photo.png",
              "alt":"فني سيارات يفحص جهد البطارية والدينامو بالملتيميتر عند تشخيص كود P0562"
            },
            {
              "id":83244,
              "slug":"p0135-o2-sensor-heater-bank1-sensor1",
              "src":"temp-media/live-photo-replacements/p0135-live-photo.png",
              "alt":"فني يفحص حساس الأكسجين أسفل السيارة بالملتيميتر عند تشخيص كود P0135"
            },
            {
              "id":83248,
              "slug":"ball-joint-symptoms-diagnosis",
              "src":"temp-media/live-photo-replacements/ball-joint-live-photo.png",
              "alt":"فني يفحص بيضة المقص Ball Joint في العفشة الأمامية داخل ورشة سيارات"
            },
            {
              "id":83252,
              "slug":"bad-shock-absorber-symptoms-diagnosis",
              "src":"temp-media/live-photo-replacements/shock-absorber-live-photo.png",
              "alt":"فني يفحص مساعد السيارة الأمامي وتسريب الزيت داخل ورشة عفشة"
            },
            {
              "id":83256,
              "slug":"engine-compression-leakdown-test-guide",
              "src":"temp-media/live-photo-replacements/compression-live-photo.png",
              "alt":"فني يجري اختبار كبس المحرك Compression Test باستخدام عداد ضغط حقيقي"
            },
            {
              "id":83260,
              "slug":"spark-plug-wet-with-fuel-diagnosis",
              "src":"temp-media/live-photo-replacements/spark-plug-live-photo.png",
              "alt":"فني يفحص بوجيه مبلول بالبنزين بجوار محرك السيارة داخل الورشة"
            }
          ]

          def api_post(path,payload,timeout=180):
              for attempt in range(6):
                  r=requests.post(BASE+path,headers=HEAD,json=payload,timeout=timeout)
                  if r.status_code==429:
                      time.sleep(6*(attempt+1))
                      continue
                  if not (200 <= r.status_code < 300):
                      raise RuntimeError(f"{path} HTTP {r.status_code}: {r.text[:1200]}")
                  return r.json()
              raise RuntimeError("rate limit persisted for "+path)

          def api_get(path,timeout=90):
              h={"X-A3tal-Key":KEY,"Authorization":"Bearer "+KEY}
              for attempt in range(6):
                  r=requests.get(BASE+path,headers=h,timeout=timeout)
                  if r.status_code==429:
                      time.sleep(5*(attempt+1))
                      continue
                  if not (200 <= r.status_code < 300):
                      raise RuntimeError(f"GET {path} HTTP {r.status_code}: {r.text[:1000]}")
                  return r.json()
              raise RuntimeError("rate limit persisted GET "+path)

          def make_webp(src,dst):
              im=Image.open(src).convert("RGB")
              w,h=im.size
              target=16/9
              cur=w/h
              if cur>target:
                  nw=int(h*target); left=(w-nw)//2
                  im=im.crop((left,0,left+nw,h))
              elif cur<target:
                  nh=int(w/target); top=(h-nh)//2
                  im=im.crop((0,top,w,top+nh))
              im=im.resize((1600,900),Image.Resampling.LANCZOS)
              im.save(dst,"WEBP",quality=88,method=6)

          def clean_old_inline(content):
              before=content
              # Remove old synthetic diagnostic figure from this publishing batch.
              content=re.sub(
                r'<figure\b[^>]*>.*?<img\b[^>]*src=["\'][^"\']+-diagnostic(?:-[^"\']*)?\.webp[^"\']*["\'][^>]*>.*?</figure>',
                '',
                content,
                flags=re.I|re.S
              )
              # Fallback if an orphan image was saved without a figure.
              content=re.sub(
                r'<img\b[^>]*src=["\'][^"\']+-diagnostic(?:-[^"\']*)?\.webp[^"\']*["\'][^>]*>',
                '',
                content,
                flags=re.I|re.S
              )
              return content, before!=content

          results=[]
          for i,item in enumerate(ITEMS,1):
              print(f"[{i}/6] {item['slug']}")
              post=api_get("/post/"+str(item["id"]))
              if post.get("slug")!=item["slug"]:
                  raise RuntimeError("Post ID/slug mismatch for "+item["slug"])

              out="/tmp/"+item["slug"]+"-live-featured.webp"
              make_webp(item["src"],out)
              with open(out,"rb") as f:
                  b64=base64.b64encode(f.read()).decode("ascii")

              media=api_post("/upload-image-data",{
                "post_id":item["id"],
                "image_base64":b64,
                "filename":item["slug"]+"-live-featured.webp",
                "title":item["alt"],
                "alt":item["alt"],
                "set_featured":True,
                "convert_webp":False
              })
              media_id=int(media["media_id"])
              media_url=media["url"]

              cleaned,changed=clean_old_inline(post.get("content",""))
              if not changed:
                  print("WARN old diagnostic inline image not found in raw content:",item["slug"])

              api_post("/update-post",{
                "id":item["id"],
                "content":cleaned,
                "featured_media":media_id,
                "status":"publish"
              })

              api_post("/admin",{
                "op":"post_meta_set",
                "post_id":item["id"],
                "meta":{
                  "_yoast_wpseo_opengraph-image":media_url,
                  "_yoast_wpseo_opengraph-image-id":str(media_id),
                  "_yoast_wpseo_twitter-image":media_url,
                  "_yoast_wpseo_twitter-image-id":str(media_id)
                }
              })

              results.append({
                "id":item["id"],
                "slug":item["slug"],
                "url":SITE+"/"+item["slug"]+"/",
                "media_id":media_id,
                "media_url":media_url
              })
              time.sleep(3)

          api_post("/admin",{"op":"cache_flush"})
          time.sleep(4)

          for r in results:
              post=api_get("/post/"+str(r["id"]))
              if int(post.get("featured_media") or 0)!=r["media_id"]:
                  raise RuntimeError("Featured media mismatch: "+r["url"])
              if "-diagnostic.webp" in post.get("content",""):
                  raise RuntimeError("Old synthetic diagnostic image still in content: "+r["url"])

              html=requests.get(r["url"],headers=UA,timeout=60).text
              soup=BeautifulSoup(html,"html.parser")
              can=soup.find("link",rel="canonical")
              if not can or can.get("href","").rstrip("/")!=r["url"].rstrip("/"):
                  raise RuntimeError("Canonical mismatch "+r["url"])
              robots=soup.find("meta",attrs={"name":"robots"})
              rv=(robots.get("content","") if robots else "").lower()
              if "index" not in rv or "max-image-preview:large" not in rv:
                  raise RuntimeError("Robots mismatch "+r["url"])
              og=soup.find("meta",attrs={"property":"og:image"})
              if not og or r["media_url"] not in og.get("content",""):
                  raise RuntimeError("OG image mismatch "+r["url"]+" got "+str(og))
              if r["media_url"] not in html:
                  raise RuntimeError("New photo missing from live HTML "+r["url"])
              if "-diagnostic.webp" in html:
                  raise RuntimeError("Old graphic still rendered "+r["url"])
              print("VERIFIED",r["url"],r["media_url"])

          with open("/tmp/result.json","w",encoding="utf-8") as f:
              json.dump(results,f,ensure_ascii=False,indent=2)
          PY
          python /tmp/replace_live_photos.py

      - name: Show verified result
        run: cat /tmp/result.json
