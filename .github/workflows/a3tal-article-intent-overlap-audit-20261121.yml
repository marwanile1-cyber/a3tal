name: A3tal cross-post cannibalization deep scan 20261121
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a3tal-article-intent-overlap-audit-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Compare all indexable article titles, slugs and real content similarities read only
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/intent_audit.py <<'PY'
          import urllib.request,urllib.parse,xml.etree.ElementTree as ET,html,re,json,difflib,collections,hashlib,time
          from html.parser import HTMLParser
          BASE="https://a3tal.com"
          def fetch(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (A3tal SEO full article audit)","Accept":"application/json,text/xml,*/*"})
            with urllib.request.urlopen(req,timeout=40) as f:return f.read().decode("utf8","replace")
          class Plain(HTMLParser):
            def __init__(self):super().__init__();self.t=[]
            def handle_data(self,s):self.t.append(s)
          def strip(s):
            p=Plain();p.feed(s);return re.sub(r'\s+',' ',html.unescape(' '.join(p.t))).strip()
          sitemap=ET.fromstring(fetch(BASE+"/post-sitemap.xml"))
          urls=set()
          for entry in sitemap:
            if entry.tag.split("}")[-1]=="url":
              for el in entry:
                if el.tag.split("}")[-1]=="loc" and el.text:urls.add(urllib.parse.unquote(el.text.rstrip("/")))
          posts=[]
          for page in range(1,12):
            u=BASE+"/wp-json/wp/v2/posts?per_page=100&page="+str(page)+"&_fields=id,slug,title,link,content"
            try: arr=json.loads(fetch(u))
            except Exception as e:
              if page==1:raise
              break
            if not arr:break
            for obj in arr:
              url=urllib.parse.unquote(str(obj.get("link","")).rstrip("/"))
              if url not in urls:continue
              title=strip(obj.get("title",{}).get("rendered",""))
              content=strip(obj.get("content",{}).get("rendered",""))
              posts.append({"id":obj["id"],"url":url+"/","title":title,"content":content,"words":len(content.split())})
            if len(arr)<100:break
          arab_trans=str.maketrans({"أ":"ا","إ":"ا","آ":"ا","ى":"ي","ة":"ه","ؤ":"و","ئ":"ي"})
          stops=set("مصر في من علي عن او مع إلى كل دليل الدليل الشامل افضل احدث الجديد الجديدة اسعار سعر كم وكيف هل ما هي هو وذلك خدمة مركز مراكز شركة سيارات سيارة صيانه الصيانه صيانة موديل مصرية المصريه المصري".split())
          def toks(s):
            s=s.lower().translate(arab_trans)
            return set(w for w in re.findall(r'[\w]+',s,flags=re.U) if len(w)>2 and w not in stops and not w.isnumeric())
          groups=collections.defaultdict(list)
          for p in posts:
            p["tokens"]=toks(p["title"])
            groups[(len(p["title"])//10)].append(p)
          results=[]
          for i,x in enumerate(posts):
            for y in posts[i+1:]:
              a,b=x["tokens"],y["tokens"]
              common=a&b
              if len(common)<3 or not a or not b:continue
              overlap=len(common)/min(len(a),len(b))
              jaccard=len(common)/len(a|b)
              if overlap<.76 and jaccard<.56:continue
              # A repeated title is only a candidate, not proven query cannibalization.
              xt,yt=x["content"],y["content"]
              comparison=difflib.SequenceMatcher(None,xt[:1600],yt[:1600],autojunk=True).ratio() if overlap>=.75 else None
              score=round(max(overlap*.8+jaccard*.2,jaccard),3)
              results.append({"a_id":x["id"],"a_title":x["title"],"a_url":x["url"],"a_words":x["words"],"b_id":y["id"],"b_title":y["title"],"b_url":y["url"],"b_words":y["words"],"shared_tokens":sorted(common),"title_overlap":round(overlap,3),"title_jaccard":round(jaccard,3),"first_1600_text_similarity":round(comparison,3) if comparison is not None else None,"candidate_score":score})
          results.sort(key=lambda x:(x["candidate_score"],x["title_jaccard"]),reverse=True)
          out={"scope":"Only currently sitemap-listed WordPress posts; not GSC page+query proof","sitemap_posts":len(urls),"read_posts":len(posts),"pairs":len(results),"top_pairs":results[:250],"short_published_posts":[{"id":p["id"],"url":p["url"],"title":p["title"],"words":p["words"]} for p in sorted(posts,key=lambda x:x["words"]) if p["words"]<220][:150]}
          with open("a3tal-post-intent-pairs-20261121.json","w",encoding="utf8") as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print("ARTICLE_AUDIT_SUMMARY",json.dumps({k:v for k,v in out.items() if k not in ("top_pairs","short_published_posts")},ensure_ascii=False),flush=True)
          print("TOP_INTENT_PAIRS",json.dumps(results[:35],ensure_ascii=False),flush=True)
          print("VERY_SHORT_POSTS",json.dumps(out["short_published_posts"][:25],ensure_ascii=False),flush=True)
          PY
          python3 /tmp/intent_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3tal-article-intent-audit-20261121
          path: a3tal-post-intent-pairs-20261121.json
          if-no-files-found: ignore
          retention-days: 30
