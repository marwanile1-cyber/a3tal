name: Create original BMW Neue Klasse 40 and 50 comparison flow infographic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-egypt-bmw-i3-official-original-infographic-20261020.yml'
      - 'scripts/attach-egypt-bmw-i3-official-original-infographic-20261020.py'
permissions:
  contents: read
concurrency:
  group: a3tal-production-content
  cancel-in-progress: false
jobs:
  add-comparison-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A3TAL_API_KEY: ${{ secrets.A3TAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow arabic-reshaper python-bidi
      - run: python3 -u scripts/attach-egypt-bmw-i3-official-original-infographic-20261020.py
